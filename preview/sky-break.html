<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crimson Eclipse · the sky breaks</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #050203; color: #e9dcd6; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px 12px; background: linear-gradient(transparent, rgba(0, 0, 0, .78)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { background: rgba(30, 10, 12, .8); color: inherit; border: 1px solid #5a2a2a; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button.on { background: #7a1d1d; border-color: #e0685a; }
  #track { flex: 1 1 240px; height: 14px; background: rgba(255, 255, 255, .12); border-radius: 7px; position: relative; cursor: pointer; min-width: 160px; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; background: #b3352c; border-radius: 7px; }
  .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff8; }
  #info { position: fixed; left: 14px; top: 12px; max-width: 520px; text-shadow: 0 1px 3px #000; }
  #info b { font-size: 15px; }
  #err { position: fixed; inset: 0; display: none; place-items: center; background: #200; color: #fbb; white-space: pre-wrap; padding: 20px; font: 12px monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"><b id="vn"></b><br><span id="vt"></span></div>
<div id="ui">
  <button id="play">❚❚</button>
  <span id="vers"></span>
  <div id="track"><div id="fill"></div><div class="mark" id="mk"></div></div>
  <span id="clock">0:00</span>
  <span>1 2 3 4: candidate · space: pause · C: climax · mouse: look</span>
</div>
<div id="err"></div>
<script>
'use strict';
// The sky is a thick shell. One fracture network (small facets grouped into slabs) decides everything: where the
// cracks run, which slabs come loose, the outline of every hole. Nothing is drawn on top of the sky: the sky
// itself is cut. Times in seconds: cracks start at T0, the climax is at TC, the loop ends at TT.
const T0 = 3, TC = 14, TT = 26;
const VERS = [
  ['B1 · Impact glass', 'Radial fracture from the moon. Slabs come loose and fall on our side, tumbling, their back pale, burning away.'],
  ['B2 · Eggshell', 'Irregular plates, no centre. Loose plates are drawn into the other world and sink into its fog.'],
  ['B3 · Blown out', 'Radial fracture. At the climax the pressure behind bursts the shell: slabs fly toward us.'],
  ['B4 · Mix', 'The first fracture from the moon. Each loose slab goes its own way: some fall on our side and burn away, others are drawn into the other world.'],
];

const VS = `#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0.,1.);}`;

const FS = `#version 300 es
precision highp float;precision highp int;
out vec4 o;
uniform vec2 uRes,uLook;uniform float uT;uniform int uVar;
const float PI=3.14159265,TAU=6.2831853,T0=${T0}.,TC=${TC}.;
const vec3 PALE=vec3(.8,.78,.74);
float ss(float a,float b,float x){float t=clamp((x-a)/(b-a),0.,1.);return t*t*(3.-2.*t);}
uint pcg(uint v){uint s=v*747796405u+2891336453u;uint w=((s>>((s>>28u)+4u))^s)*277803737u;return (w>>22u)^w;}
float hi2(ivec2 c){return float(pcg(pcg(uint(c.x))+uint(c.y)*1597334677u))*(1./4294967295.);}
vec2 h22(ivec2 c){return vec2(hi2(c),hi2(c+ivec2(17,59)));}
float vnoise(vec2 p){vec2 fl=floor(p);ivec2 i=ivec2(fl);vec2 f=p-fl;f=f*f*(3.-2.*f);
  return mix(mix(hi2(i),hi2(i+ivec2(1,0)),f.x),mix(hi2(i+ivec2(0,1)),hi2(i+ivec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+vec2(17.3,9.1);a*=.5;}return s;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdSeg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}

// ---- the chart: a direction -> a point p around the impact (radians) -> fracture space w
vec3 C,E1,E2;                  // the impact (where the moon is) and its tangent frame
bool RADIAL;float A,KFLAT;     // log-polar around the impact, or flat
vec2 FS,CS;                    // facet grid = w*FS; a slab is about CS wide in w
int NYF,NYC;                   // rows around the impact, for facets and for slabs (0: no wrap)
float SPREAD,THA,THB;bool FIRST,BEHIND;    // how a loose slab leaves: 0 falls, 1 drawn in, 2 blown out
vec2 toP(vec3 d){float ang=acos(clamp(dot(d,C),-1.,1.));vec2 q=vec2(dot(d,E1),dot(d,E2));return q/max(length(q),1e-6)*ang;}
vec3 toD(vec2 p){float r=length(p);return C*cos(r)+(E1*p.x+E2*p.y)/max(r,1e-6)*sin(r);}
vec2 toW(vec2 p,out float sc){
  if(RADIAL){float r=max(length(p),.02);sc=r/A;return vec2(log(r)*A,atan(p.y,p.x)*A);}
  sc=1./KFLAT;return p*KFLAT+(vec2(vnoise(p*5.),vnoise(p*5.+9.3))-.5)*.5;}
vec2 fromW(vec2 w){if(RADIAL){float r=exp(w.x/A),th=w.y/A;return r*vec2(cos(th),sin(th));}return w/KFLAT;}
int wrap(int y,int n){return n>0?((y%n)+n)%n:y;}

// ---- the fracture network: facets (one pass, integer cells), grouped into slabs
void facet(vec2 w,out ivec2 id,out vec2 ctr,out float ed,out vec2 ctr2){
  vec2 g=w*FS;ivec2 n=ivec2(floor(g));float d1=1e9,d2=1e9;id=ivec2(0);ctr=vec2(0);ctr2=vec2(1.,0.);
  for(int j=-2;j<=2;j++)for(int i=-2;i<=2;i++){
    ivec2 c=n+ivec2(i,j),cw=ivec2(c.x,wrap(c.y,NYF));
    vec2 pt=(vec2(c)+.5+(h22(cw)-.5)*.85)/FS;float dd=dot(pt-w,pt-w);
    if(dd<d1){d2=d1;ctr2=ctr;d1=dd;id=cw;ctr=pt;}else if(dd<d2){d2=dd;ctr2=pt;}}
  ed=dot(.5*(ctr+ctr2)-w,normalize(ctr2-ctr));}
ivec2 slab(vec2 ctr){
  ivec2 n=ivec2(floor(ctr/CS)),r=ivec2(0);float b=1e9;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){
    ivec2 c=n+ivec2(i,j),cw=ivec2(c.x,wrap(c.y,NYC));
    vec2 pt=(vec2(c)+.5+(h22(cw+ivec2(91,37))-.5)*.7)*CS;float dd=dot(pt-ctr,pt-ctr);
    if(dd<b){b=dd;r=cw;}}
  return r;}
struct Shell{ivec2 id,grp,grp2;float ed;vec2 w,nrm;};
Shell shell(vec3 d){Shell s;float sc;vec2 c1,c2;float ed;s.w=toW(toP(d),sc);
  facet(s.w,s.id,c1,ed,c2);s.grp=slab(c1);s.grp2=slab(c2);s.ed=ed*sc;s.nrm=normalize(c2-c1);return s;}

// ---- the plan: when the crack front reaches a point, when a slab comes loose
float tCrack(vec2 p){float r=length(p);vec2 u=p/max(r,1e-5);
  float re=r*(.6+.8*vnoise(u*1.7+vec2(7.3,2.1)))/.15,kf=floor(re);
  return min(T0+.7*(kf+.2*(re-kf)),TC);}               // the front jumps on each beat, then waits
struct Sch{float tf,size,h;vec3 dir;};
Sch sched(ivec2 cw){Sch q;
  vec2 p=fromW((vec2(cw)+.5+(h22(cw+ivec2(91,37))-.5)*.7)*CS);float r=length(p);
  q.dir=toD(p);q.size=.5*min(CS.x,CS.y)*(RADIAL?r/A:1./KFLAT);q.h=hi2(cw+ivec2(7,13));q.tf=1e9;
  float n=vnoise(p*2.4+vec2(5.3,1.7));
  if(r>.2&&r<2.2&&n>mix(THA,THB,ss(.3,1.5,r))){
    q.tf=TC+.15+r*SPREAD+q.h*.5;
    if(q.h<.22&&r<.9) q.tf=min(tCrack(p)+1.5+8.*q.h,TC-.5);}
  return q;}

// ---- our sky, painted on the shell
vec3 skyTex(vec3 d){
  vec2 u=vec2(atan(d.z,d.x),asin(clamp(d.y,-1.,1.)));
  vec3 c=mix(vec3(.3,.035,.03),vec3(.035,.004,.012),pow(ss(-.02,.8,d.y),.6));
  c+=vec3(.5,.07,.05)*pow(fbm(u*vec2(3.,7.)+3.),2.5)*.9;
  float band=.78+.1*sin(u.x*3.);
  c+=vec3(.8,.1,.12)*exp(-pow((u.y-band)/.13,2.))*(.35+.65*pow(.5+.5*sin(u.x*40.+fbm(u*4.)*6.),2.))*.3;
  vec2 g=u*70.;ivec2 i=ivec2(floor(g));vec2 f=g-floor(g)-.5-(h22(i)-.5)*.7;
  c+=vec3(1.,.9,.85)*step(.86,hi2(i+ivec2(9,2)))*ss(.08,0.,length(f))*(.4+.6*hi2(i+ivec2(3,8)));
  return c;}
// a piece of the shell, cracked: it sits a little askew, so the sky on it is shifted and catches the light
vec3 shardCol(vec3 d,Shell s,float crk,float crkMin,float heat){
  vec2 hh=h22(s.grp+ivec2(3,71));
  vec3 c=skyTex(normalize(d+(E1*(hh.x-.5)+E2*(hh.y-.5))*.035*crk));
  c*=1.+((hi2(s.grp+ivec2(5,5))-.5)*.55+(hi2(s.id+ivec2(8,1))-.5)*.16*crkMin)*crk;
  c+=vec3(.22,.03,.02)*ss(.6,1.,hi2(s.grp+ivec2(9,9)))*crk;
  const float W=.0016;
  if(s.grp!=s.grp2){
    float line=ss(W,W*.4,s.ed);
    c=mix(c,c*.06,line*crk);
    c+=vec3(.9,.25,.15)*ss(W*3.2,W,s.ed)*(1.-line)*max(0.,dot(s.nrm,vec2(.6,.8)))*.55*crk;
    c+=vec3(3.,1.5,.7)*ss(W*2.5,0.,s.ed)*heat;
  }else{
    c=mix(c,c*.3,ss(W*.6,W*.2,s.ed)*crkMin);
    c+=vec3(2.,.9,.4)*ss(W*1.2,0.,s.ed)*heat*crkMin*.5;}
  return c;}

// ---- the other side: the Pale Realm (black sun, fog, floating shards, the Spire)
vec3 otherSide(vec3 d){
  vec2 u=vec2(atan(d.z,d.x)*.88,asin(clamp(d.y,-1.,1.)));const float H0=.24;
  vec3 c=mix(vec3(.85,.83,.79),vec3(.6,.6,.64),smoothstep(H0,1.1,u.y));
  vec2 sp=u-vec2(-.42,.7);float sr=length(sp),sa=atan(sp.y,sp.x);
  c+=vec3(1.)*exp(-sr*4.)*.1;
  c+=vec3(1.)*pow(max(0.,sin(sa*14.+3.*fbm(vec2(sa*3.,uT*.1)))),20.)*exp(-sr*5.)*.3*step(.088,sr);
  c=mix(c,vec3(.01),smoothstep(.088,.084,sr));
  c+=vec3(1.)*exp(-abs(sr-.087)*220.)*.8;
  c=mix(c,PALE*1.02,smoothstep(.45,.75,fbm(u*vec2(2.,6.)+vec2(uT*.02,0.)))*.35);
  for(int k=0;k<6;k++){float fk=float(k),h=hi2(ivec2(k,3));
    vec2 ctr=vec2(-1.2+.5*fk+.08*sin(uT*.1+fk),.5+.3*h+.03*sin(uT*.3+fk*2.));
    vec2 q=rot(uT*.08*(hi2(ivec2(k,5))-.5)+fk)*(u-ctr);
    float sz=.02+.03*hi2(ivec2(k,7)),sd=abs(q.x)/(sz*.55)+abs(q.y)/(sz*1.6);
    c=mix(c,mix(vec3(.03),PALE,.1+.35*hi2(ivec2(k,11))),smoothstep(1.02,.98,sd));}
  {float D=160.,H=120.;vec2 lp=vec2((u.x+.62)*D,(u.y-(H0-.26))*D);
    float y=clamp(lp.y,0.,H),k=1.-y/H,w=1.6+15.*pow(k,1.3)+3.5*step(fract(y/14.),.18)*k;
    float sd=max(abs(lp.x)-w,max(-lp.y,lp.y-H));
    for(int i=0;i<6;i++){float yy=18.+float(i)*16.,kk=1.-yy/H,sg=sign(float(i%2)-.5);
      sd=min(sd,sdSeg(lp,vec2((1.6+15.*pow(kk,1.3))*sg,yy),vec2((8.+20.*kk)*sg,yy+7.+5.*kk))-1.2*kk-.4);}
    float rise=smoothstep(H0-.14,H0+.12,u.y);
    c+=vec3(.95,.95,1.)*exp(-length(lp-vec2(0.,H+2.))*.25)*(.7+.3*sin(uT*1.7))*rise*.9;
    c=mix(c,mix(vec3(.025,.022,.03),PALE,.26-.1*smoothstep(H0,H0+.5,u.y)),smoothstep(.7,-.7,sd)*rise);}
  c=mix(c,PALE*1.04,smoothstep(H0+.12,H0-.25,u.y));
  vec2 ag=u*70.+vec2(uT*.5,-uT*.2);ivec2 ai=ivec2(floor(ag));vec2 af=ag-floor(ag)-.5-(h22(ai)-.5)*.5;
  c=mix(c,vec3(.12,.11,.1),step(hi2(ai+ivec2(4,4)),.12)*smoothstep(.09,.03,length(af*vec2(1.,1.8))));
  return c;}

// ---- loose slabs on their way: the pixel is carried back to where the slab sat, and tested there
vec4 pieces(vec3 d,vec2 wPix){
  ivec2 n=ivec2(floor(wPix/CS));vec4 res=vec4(0);
  for(int j=-2;j<=2;j++)for(int i=-2;i<=2;i++){
    ivec2 cw=ivec2(n.x+i,wrap(n.y+j,NYC));Sch q=sched(cw);float age=uT-q.tf;
    int MODE=uVar==3?(hi2(cw+ivec2(63,21))<.5?0:1):uVar;float LIFE=MODE==0?1.5:MODE==1?2.8:.9;
    if(age<=0.||age>=LIFE) continue;
    if(MODE==1&&res.a>0.) continue;                                             // a slab on our side hides one behind
    float k=age/LIFE;vec3 c=q.dir;float dc=dot(d,c);if(dc<.2) continue;
    vec3 t1=normalize(cross(vec3(0.,1.,0.),c)),t2=cross(c,t1);
    vec2 x=vec2(dot(d,t1),dot(d,t2))/dc;
    vec2 hh=h22(cw+ivec2(41,5)),hk=h22(cw+ivec2(2,77));
    vec2 delta;float scl,tum,alpha=1.;
    if(MODE==0){delta=q.size*vec2((hh.x-.5)*.8*age,-(.3*age+1.1*age*age));scl=1.+.25*k;tum=(1.5+2.5*hh.y)*age;}
    else if(MODE==1){float e=k*k*(3.-2.*k);delta=q.size*vec2((hh.x-.5)*.7,.45)*e;scl=1.-.82*e;tum=(.6+1.2*hh.y)*age;alpha=1.-ss(.85,1.,k);}
    else{float e=1.-(1.-k)*(1.-k);vec2 rd=vec2(dot(c-C,t1),dot(c-C,t2));rd/=max(length(rd),1e-4);
      delta=q.size*rd*1.5*e;scl=1.+1.1*e;tum=(4.+4.*hh.y)*age;alpha=1.-ss(.6,1.,k);}
    vec2 y=rot(-(hk.x-.5)*1.6*age)*((x-delta)/scl);
    float ax=TAU*hk.y,ct=cos(tum);
    y=rot(-ax)*y;y.x/=max(abs(ct),.07);if(ct<0.) y.x=-y.x;y=rot(ax)*y;
    vec3 dr=normalize(c+t1*y.x+t2*y.y);
    Shell s=shell(dr);if(s.grp!=cw) continue;
    float e=s.grp2!=cw?s.ed*scl:1.;
    vec3 col;
    if(ct>0.){col=shardCol(dr,s,1.,1.,0.)*(.5+.5*ct);
      col+=vec3(1.,.35,.22)*pow(max(0.,sin(tum*1.3+hh.x*TAU)),24.)*.5;}        // it catches the moon
    else{col=PALE*(.35+.5*abs(ct))*(.75+.4*fbm(s.w*3.));                       // its back: the other world's side
      col=mix(col,vec3(.25,.03,.03),ss(.55,.7,fbm(s.w*6.+4.))*.6);}
    col=mix(col,PALE*1.15,exp(-e/.0035)*.85);                                   // its broken edge, lit from behind
    if(MODE==0&&FIRST){float er=vnoise(s.w*2.5+q.h*10.),th=1.15-1.3*ss(.45,1.,k);  // it burns away as it falls
      if(er>th) continue;col+=vec3(3.,1.1,.3)*ss(th-.1,th,er);}
    if(MODE==0&&!FIRST&&hi2(s.id+ivec2(31,4))<ss(.4,1.,k)*1.05) continue;       // or crumbles, facet by facet
    if(MODE==1) col=mix(col,PALE,ss(.1,1.,k)*.92);                              // it sinks into the fog
    if(MODE==2) col*=1.+.6*k;
    if(alpha>res.a||(MODE!=1&&BEHIND)){res=vec4(col,alpha);BEHIND=MODE==1;}}
  return res;}

void main(){
  RADIAL=uVar!=1;FIRST=uVar==0||uVar==3;A=(FIRST?36.:48.)/TAU;KFLAT=10.;BEHIND=false;
  if(FIRST){FS=vec2(.625,1.);CS=vec2(3.2,3.);NYF=36;NYC=12;}                    // the first network, the one Bastien preferred
  else if(RADIAL){FS=vec2(.36,1.);CS=vec2(4.2,4.);NYF=48;NYC=12;}else{FS=vec2(1.);CS=vec2(2.6);NYF=0;NYC=0;}
  THA=FIRST?.3:.56;THB=FIRST?.78:.9;
  SPREAD=uVar==0?1.1:uVar==1?2.:uVar==2?.45:1.5;
  float el=.47;C=vec3(cos(el),sin(el),0.);E1=normalize(cross(vec3(0.,1.,0.),C));E2=cross(C,E1);
  float yaw=uLook.x*.5,pit=.4-uLook.y*.3;
  vec3 F=vec3(cos(pit)*cos(yaw),sin(pit),cos(pit)*sin(yaw)),Rv=normalize(cross(F,vec3(0.,1.,0.))),Uv=cross(Rv,F);
  vec2 sc=(gl_FragCoord.xy*2.-uRes)/uRes.y*tan(.54);
  vec3 d=normalize(F+Rv*sc.x+Uv*sc.y);
  float az=atan(d.z,d.x),hill=.02+.05*fbm(vec2(az*3.,1.))+.02*fbm(vec2(az*14.,5.));
  vec3 col;float open=0.;
  float tc=uT-TC;
  if(d.y>hill-.01){
    vec2 p=toP(d);Shell s=shell(d);Sch a=sched(s.grp),b=sched(s.grp2);
    float ageA=uT-a.tf,ageB=uT-b.tf,tk=tCrack(p);
    float crk=ss(0.,.05,uT-tk),crkMin=max(ss(0.,.3,uT-(T0+(tk-T0)*1.7+.4)),step(TC,uT));
    float heat=uT>tk?exp(-(uT-tk)*4.):0.;
    bool major=s.grp!=s.grp2;
    // the light of the other side pressing through every crack around the climax
    float press=tc<0.?ss(-2.5,0.,tc)*(.55+.45*sin(uT*14.)):exp(-tc*1.3);
    if(ageA<=0.){
      col=shardCol(d,s,crk,crkMin,heat);
      if(major){
        float pre=max(ss(-1.3,0.,ageA),ageB<=0.?ss(-1.3,0.,ageB):0.),lw=.0016*(1.+(FIRST?3.5:2.2)*pre);
        col+=PALE*(1.4*ss(lw,lw*.3,s.ed)*pre+.45*exp(-s.ed/.006)*pre*pre);       // it comes loose: light leaks round it
        col+=PALE*press*crk*(FIRST?ss(.0035,0.,s.ed)+.3*exp(-s.ed/.008):ss(.0022,0.,s.ed)+.18*exp(-s.ed/.006));
        if(ageB>0.){col=mix(col,PALE*1.1,ss(.004,.0005,s.ed));                    // the lip of a hole
          col+=PALE*exp(-ageB*4.)*exp(-s.ed/.012)*.8;}}
    }else{
      int k=0;                                                                   // the shell is thick: its broken wall
      for(int i=1;i<=4;i++){Shell s2=shell(normalize(d+vec3(0.,.022*float(i)/4.,0.)));
        if(uT<sched(s2.grp).tf){k=i;break;}}
      if(k>0){float kk=(float(k)-1.)/3.;
        col=mix(vec3(.16,.012,.02),vec3(.5,.1,.09),kk);col=mix(col,PALE*.9,kk*kk*.75);
        col*=.7+.6*vnoise(vec2(az*170.,d.y*30.));
      }else{col=otherSide(d);open=1.;
        col+=PALE*exp(-ageA*4.)*.25;}
    }
    // the moon, on our side of the shell
    float ang=length(p),Rm=.26;
    float cor=(exp(-max(ang-Rm,0.)*5.)*.5+exp(-max(ang-Rm,0.)*22.))*(1.-.75*open);
    col+=vec3(1.,.2,.05)*cor*(.8+.2*sin(uT*5.4));
    vec4 pc=pieces(d,s.w);
    if(BEHIND) pc.a*=open;                                                      // drawn in: seen through the holes only
    col=mix(col,pc.rgb,pc.a);
    if(ang<Rm){vec2 q=p/Rm;float r=length(q);
      vec3 mc=vec3(.75,.08,.04)*(.55+.6*fbm(q*3.+2.))*sqrt(max(1.-r*r*.8,0.));
      mc=mix(mc,vec3(.1,.0,.0),ss(.45,.65,fbm(q*1.6+7.))*.6);
      col=mix(col,mc,ss(1.,.985,r));}
    col+=PALE*.22*(tc>0.?exp(-tc*4.):0.);
    col=mix(col,vec3(.16,.02,.02),exp(-max(d.y-hill,0.)*16.)*.6);
  }
  if(d.y<hill) col=mix(vec3(.012,.004,.005),vec3(.09,.012,.012),ss(-.25,.05,d.y-hill)*.5);
  col=vec3(1.)-exp(-col*1.3);
  o=vec4(pow(col,vec3(.95)),1.);
}`;

const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
function fail(msg) { const e = document.getElementById('err'); e.style.display = 'grid'; e.textContent = msg; throw new Error(msg); }
if (!gl) fail('WebGL 2 is not available.');
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail(gl.getShaderInfoLog(s));
  return s;
}
const pr = gl.createProgram();
gl.attachShader(pr, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, shader(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(pr));
gl.useProgram(pr); gl.bindVertexArray(gl.createVertexArray());
const U = n => gl.getUniformLocation(pr, n);

const qs = new URLSearchParams(location.search);
let ver = +(qs.get('v') || 0), time = +(qs.get('t') || 0), playing = !qs.has('t'), mx = 0, my = 0, last = 0;
const scale = +(qs.get('s') || 1);
const $ = id => document.getElementById(id);
function setVer(i) {
  ver = i; [...$('vers').children].forEach((b, j) => b.classList.toggle('on', j === i));
  $('vn').textContent = VERS[i][0]; $('vt').textContent = VERS[i][1];
}
VERS.forEach((v, i) => { const b = document.createElement('button'); b.textContent = v[0]; b.onclick = () => setVer(i); $('vers').append(b, ' '); });
setVer(ver);
function setPlaying(p) { playing = p; $('play').textContent = p ? '❚❚' : '▶'; }
setPlaying(playing);
$('play').onclick = () => setPlaying(!playing);
$('mk').style.left = TC / TT * 100 + '%';
const track = $('track');
const seek = e => { const r = track.getBoundingClientRect(); time = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * TT; };
track.addEventListener('pointerdown', e => { track.setPointerCapture(e.pointerId); seek(e); });
track.addEventListener('pointermove', e => { if (e.buttons & 1) seek(e); });
cv.addEventListener('pointermove', e => { mx = e.clientX / innerWidth * 2 - 1; my = e.clientY / innerHeight * 2 - 1; });
cv.addEventListener('pointerleave', () => { mx = my = 0; });
addEventListener('keydown', e => {
  if (e.key === ' ') { setPlaying(!playing); e.preventDefault(); }
  if (e.key >= '1' && e.key <= '4') setVer(+e.key - 1);
  if (e.key === 'c' || e.key === 'C') { time = TC - 3; setPlaying(true); }
});
function draw() {
  const w = Math.round(innerWidth * scale), h = Math.round(innerHeight * scale);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  gl.uniform2f(U('uRes'), w, h); gl.uniform2f(U('uLook'), mx, my);
  gl.uniform1f(U('uT'), time); gl.uniform1i(U('uVar'), ver);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  $('fill').style.width = time / TT * 100 + '%';
  $('clock').textContent = '0:' + String(Math.floor(time)).padStart(2, '0');
}
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing) { time += dt; if (time >= TT) time = 0; }
  draw(); requestAnimationFrame(frame);
}
// for checking: one exact frame at time t for candidate v, paused
window.__shot = (t, v) => { setPlaying(false); setVer(v); time = t; draw(); return gl.getError(); };
requestAnimationFrame(frame);
</script>
