<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Structures</title>
<!--
  Second round of the first big structure (vault/04 - Design/Structures.md), after Bastien's look at the first three
  (2026-11-16: observatory disliked, chapel not good enough, manor empty and school-like, not imposing).
  Three imposing candidates with furnished insides, each by day (a ruin) and under the blood moon (it wakes up).
  Real Minecraft blocks only, each in one cell (preview/lib). Use the Cut slider to look inside.
  URL parameters: ?v=a|b|c  &night=1  &ui=0  &spin=0
-->
</head>
<body>
<script src="vanilla/textures.js" onerror="void 0"></script>
<script src="lib/blocks.js"></script>
<script src="lib/world.js"></script>
<script src="lib/textures.js"></script>
<script src="lib/viewer.js"></script>
<script>
'use strict';
const { hash3, vnoise, ss } = CE.math, K = CE.kit;
const { M4, Tm, Sm, RX, RY, RZ, about, applyP, applyD, spinUp, norm, dirFrom } = CE.m;
const pick = (list, r) => list[Math.floor(r*list.length) % list.length];
const RUBBLE = e => pick(['cobbled_deepslate', 'cobblestone', 'gravel', 'cobbled_deepslate', 'mossy_cobblestone'], hash3(e.x, e.y*3, e.z));
const facingIn = (dx, dz) => Math.abs(dx) >= Math.abs(dz) ? (dx < 0 ? 'east' : 'west') : (dz < 0 ? 'south' : 'north');
const LIT = d => ({ awake:{ lit:true }, d });
// round wall: cells at distance [r - th, r) from (cx, cz)
function cylinder(W, cx, cz, r, th, y0, y1, block, opts) { const R = Math.ceil(r);
  for (let dx = -R; dx <= R; dx++) for (let dz = -R; dz <= R; dz++) { const d = Math.hypot(dx, dz); if (d >= r || d < r - th) continue;
    for (let y = y0; y <= y1; y++) W.set(cx + dx, y, cz + dz, typeof block === 'function' ? block(cx + dx, y, cz + dz, d) : block, opts); } }
function clearDisc(W, cx, cz, r, y0, y1) { const R = Math.ceil(r);
  for (let dx = -R; dx <= R; dx++) for (let dz = -R; dz <= R; dz++) if (Math.hypot(dx, dz) < r) for (let y = y0; y <= y1; y++) W.del(cx + dx, y, cz + dz); }
// witch-hat roof: rings of tiles, the outer cells stairs facing in (their corners shape themselves)
function cone(W, cx, cz, r, y0, levels, tile, stairs, tip) {
  for (let k = 0; k < levels; k++) { const rk = r*(1 - k/levels);
    if (rk < .8) { W.set(cx, y0 + k, cz, tile); continue; }
    const R = Math.ceil(rk);
    for (let dx = -R; dx <= R; dx++) for (let dz = -R; dz <= R; dz++) { const d = Math.hypot(dx, dz); if (d >= rk || d < rk - 1.6) continue;
      W.set(cx + dx, y0 + k, cz + dz, d >= rk - 1 ? `${stairs}[facing=${facingIn(dx, dz)}]` : tile); } }
  if (tip) tip.forEach((b, i) => W.set(cx, y0 + levels + i, cz, b[0], b[1] || {}));
}

// ================================================================ A · the citadel of the vigil
function citadel(W) {
  const B = 9, WALL = 'deepslate_bricks', TRIM = 'polished_blackstone_bricks', TILE = 'deepslate_tiles', TS = 'deepslate_tile_stairs', GLASS = 'crimson_eclipse:eclipse_glass';
  const H = B + 13, KH = B + 34, merlon = 'polished_blackstone_bricks';
  // curtain walls: 3 thick, a walkway, a crenellated parapet, arrow slits
  for (let x = -24; x <= 24; x++) for (let z = -24; z <= 24; z++) { const m = Math.max(Math.abs(x), Math.abs(z)); if (m < 22) continue;
    for (let y = 0; y <= H; y++) W.set(x, y, z, y === B - 1 || y === H ? TRIM : WALL);
    if (m === 24) { W.set(x, H + 1, z, WALL); if (((x + z) & 1) === 0) W.set(x, H + 2, z, merlon);
      const u = Math.abs(x) === 24 ? z : x; if (u % 5 === 0 && Math.abs(u) < 20) for (let y = B + 6; y <= B + 8; y++) W.del(x, y, z); } }
  // corner towers: round, witch-hat roofs, eclipse-glass slits that light at night
  const towers = [[-24, -24], [24, -24], [-24, 24], [24, 24]];
  towers.forEach(([cx, cz], i) => {
    cylinder(W, cx, cz, 6.5, 2, 0, B + 21, (x, y) => y === B + 21 || y === H ? TRIM : WALL);
    clearDisc(W, cx, cz, 4.5, B, B + 22);
    cylinder(W, cx, cz, 4.5, 4.5, B - 1, B - 1, 'spruce_planks');
    for (const [dx, dz] of [[6, 0], [-6, 0], [0, 6], [0, -6]]) for (const y0 of [B + 5, B + 13]) for (let y = y0; y <= y0 + 2; y++) W.set(cx + dx, y, cz + dz, GLASS, { d:4.4 + i*.5 + (y0 > B + 6 ? .3 : 0) });
    if (i !== 1) cone(W, cx, cz, 7.6, B + 22, 14, TILE, TS, [['polished_blackstone_wall'], ['crimson_eclipse:crimson_crystal_cluster', { d:4.2 + i*.5 }]]);
  });
  // gatehouse: two square towers, a portcullis (group 1) that rises at night, banners, braziers
  for (const s of [-1, 1]) { for (let x = s*5; Math.abs(x) <= 11; x += s) for (let z = 21; z <= 27; z++) for (let y = 0; y <= B + 19; y++) W.set(x, y, z, y === B + 19 || y === B - 1 ? TRIM : WALL);
    K.pyramid(W, s*8, 24, B + 20, [4, 3, 3, 2, 2, 1, 1, 0, 0], TILE, TS);
    W.set(s*8, B + 15, 28, 'red_wall_banner[facing=south]'); W.set(s*4, B, 29, 'polished_blackstone_wall'); W.set(s*4, B + 1, 29, 'campfire[lit=false]', LIT(3.5)); }
  for (let x = -4; x <= 4; x++) for (let z = 21; z <= 27; z++) for (let y = 0; y <= B + 15; y++) W.set(x, y, z, y === B + 15 ? TRIM : WALL);
  for (let x = -4; x <= 4; x++) if (((x + 27) & 1) === 0) W.set(x, B + 16, 27, merlon);
  const arch = (x, y) => Math.abs(x) <= 3 && y >= B && (y <= B + 5 || (y === B + 6 && Math.abs(x) <= 2) || (y === B + 7 && Math.abs(x) <= 1));
  for (let x = -3; x <= 3; x++) for (let y = B; y <= B + 7; y++) if (arch(x, y)) for (let z = 20; z <= 27; z++) W.del(x, y, z);
  for (let x = -3; x <= 3; x++) for (let y = B; y <= B + 7; y++) if (arch(x, y)) W.set(x, y, 25, 'iron_bars', { g:1 });
  W.set(0, B + 12, 28, 'black_wall_banner[facing=south]');
  // the keep: four floors, corner turrets with roofs, eclipse-glass windows, crenellated roof
  for (let x = -12; x <= 12; x++) for (let z = -12; z <= 12; z++) { const m = Math.max(Math.abs(x), Math.abs(z));
    if (m >= 11) { for (let y = B - 1; y <= KH; y++) W.set(x, y, z, [B - 1, B + 13, B + 24, KH].includes(y) ? TRIM : WALL);
      if (m === 12) { W.set(x, KH + 1, z, WALL); if (((x + z) & 1) === 0) W.set(x, KH + 2, z, merlon); } }
    else { W.set(x, B - 1, z, ((x + z) & 1) ? 'polished_deepslate' : 'polished_blackstone'); W.set(x, B + 13, z, 'dark_oak_planks'); W.set(x, B + 24, z, 'dark_oak_planks'); W.set(x, KH, z, TILE); } }
  for (const [cx, cz] of [[-12, -12], [12, -12], [-12, 12], [12, 12]]) { cylinder(W, cx, cz, 3.7, 1.3, B - 1, KH + 8, (x, y) => y === KH + 8 ? TRIM : WALL);
    clearDisc(W, cx, cz, 2.4, KH + 1, KH + 8); cone(W, cx, cz, 4.6, KH + 9, 9, TILE, TS, [['iron_chain']]); }
  const faces = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  for (const [fx, fz] of faces) for (const u of [-6, 0, 6]) for (const [y0, y1, d0] of [[B + 4, B + 10, 4.6], [B + 16, B + 21, 5.4], [B + 27, B + 31, 6.2]]) {
    if (fz === 1 && u === 0 && y0 === B + 4) continue;
    for (let y = y0; y <= y1; y++) for (let v = -1; v <= 1; v++) { if (y === y1 && v) continue;
      const x = fx ? fx*12 : u + v, z = fz ? fz*12 : u + v, xi = fx ? fx*11 : x, zi = fz ? fz*11 : z;
      if (hash3(x, y0, z) > .82) W.del(x, y, z); else W.set(x, y, z, GLASS, { d:d0 + (u + 6)*.04 }); W.del(xi, y, zi); } }
  // keep door: a pair of doors that swing open at night, braziers on each side
  for (let y = B; y <= B + 3; y++) for (const x of [-1, 0]) W.del(x, y, 11);
  W.door(-1, B, 12, 'dark_oak_door', { facing:'south', hinge:'left' }, { awake:{ open:true }, d:4.2 });
  W.door(0, B, 12, 'dark_oak_door', { facing:'south', hinge:'right' }, { awake:{ open:true }, d:4.2 });
  for (const x of [-2, 1]) for (let y = B; y <= B + 4; y++) W.set(x, y, 13, TRIM); W.set(-1, B + 4, 13, TRIM); W.set(0, B + 4, 13, TRIM);
  for (const s of [-1, 1]) { W.set(s*4 - (s < 0 ? 0 : 1), B, 14, 'polished_blackstone_wall'); W.set(s*4 - (s < 0 ? 0 : 1), B + 1, 14, 'campfire[lit=false]', LIT(4)); }
  // the great hall: pillars and beams, two long tables with chairs and candles, a red carpet to the throne, chandeliers, a fireplace
  for (const x of [-7, 7]) for (const z of [-6, -1, 4, 9]) { for (let y = B; y <= B + 11; y++) W.set(x, y, z, 'polished_deepslate'); W.set(x, B + 12, z, 'chiseled_deepslate'); }
  for (const z of [-6, -1, 4, 9]) for (let x = -10; x <= 10; x++) if (Math.abs(x) !== 7) W.set(x, B + 12, z, 'dark_oak_log[axis=x]');
  for (const [t0, c0, c1] of [[-4, -5, -2], [3, 2, 5]]) for (let z = -5; z <= 7; z++) {
    for (const x of [t0, t0 + 1]) W.set(x, B, z, 'dark_oak_slab[type=top]');
    if (z % 3 === 0) W.set(t0 + (z & 1), B + 1, z, 'candle[candles=3,lit=false]', LIT(4.5 + (z + 5)*.05));
    if ((z & 1) === 0) { if (hash3(c0, z, 1) > .2) W.set(c0, B, z, `dark_oak_stairs[facing=${c0 < t0 ? 'west' : 'east'}]`); if (hash3(c1, z, 1) > .2) W.set(c1, B, z, `dark_oak_stairs[facing=${c1 < t0 ? 'west' : 'east'}]`); } }
  for (let z = -6; z <= 10; z++) for (let x = -1; x <= 1; x++) W.set(x, B, z, 'red_carpet');
  for (let x = -4; x <= 4; x++) { for (let z = -10; z <= -8; z++) W.set(x, B, z, 'polished_blackstone'); W.set(x, B, -7, 'polished_blackstone_stairs[facing=north]'); }
  for (let x = -1; x <= 1; x++) for (let z = -9; z <= -8; z++) W.set(x, B + 1, z, 'red_carpet');
  W.set(0, B + 1, -9, 'polished_blackstone_stairs[facing=north]'); W.set(-1, B + 1, -9, 'polished_blackstone_wall'); W.set(1, B + 1, -9, 'polished_blackstone_wall');
  for (let y = B + 1; y <= B + 3; y++) W.set(0, y, -10, 'chiseled_polished_blackstone'); W.set(0, B + 4, -10, 'gold_block');
  for (const x of [-4, 0, 4]) W.set(x, B + 9, -10, `${x ? 'black' : 'red'}_wall_banner[facing=south]`);
  for (const s of [-1, 1]) { W.set(s*3, B + 1, -9, 'polished_blackstone_wall'); W.set(s*3, B + 2, -9, 'polished_blackstone_wall'); W.set(s*3, B + 3, -9, 'crimson_eclipse:vigil_lantern', { d:4.3 }); }
  for (const z of [-4, 1, 6]) { for (let y = B + 10; y <= B + 12; y++) W.set(0, y, z, 'iron_chain'); W.set(0, B + 9, z, 'crimson_eclipse:vigil_lantern[hanging=true]', { d:4.6 + (6 - z)*.05 }); }
  for (const s of [-1, 1]) for (const z of [-4, 3]) W.set(s*10, B + 7, z, `red_wall_banner[facing=${s < 0 ? 'east' : 'west'}]`);
  for (let y = B; y <= B + 2; y++) for (let z = -1; z <= 1; z++) W.del(11, y, z);
  W.set(11, B, 0, 'campfire[lit=false]', LIT(4.4));
  for (let z = -2; z <= 2; z++) W.set(10, B + 3, z, TRIM); for (let y = B; y <= B + 2; y++) { W.set(10, y, -2, TRIM); W.set(10, y, 2, TRIM); }
  // the staircase up along the west wall, a hole in the floor above it
  for (let k = 0; k <= 13; k++) for (const x of [-10, -9]) { const z = 10 - k; for (let y = B; y < B + k; y++) W.set(x, y, z, WALL); W.set(x, B + k, z, `${TS}[facing=north]`); }
  for (const x of [-10, -9]) for (let z = -2; z <= 1; z++) W.del(x, B + 13, z);
  // second floor: library and armoury
  for (const s of [-1, 1]) for (let z = -10; z <= 10; z++) for (let y = B + 14; y <= B + 15; y++) if (!(s < 0 && z > -4)) W.set(s*10, y, z, 'bookshelf');
  for (let x = -6; x <= 6; x++) for (let y = B + 14; y <= B + 16; y++) if (Math.abs(x) > 1) W.set(x, y, -10, 'bookshelf');
  for (const [x, z] of [[8, 8], [9, 8], [8, 9], [9, 9], [8, 7], [-6, 9]]) W.set(x, B + 14, z, 'barrel'); W.set(9, B + 15, 9, 'barrel');
  W.set(6, B + 14, 9, 'chest[facing=north]'); W.set(-5, B + 14, -9, 'chest[facing=south]');
  for (let x = -1; x <= 1; x++) W.set(x, B + 14, 2, 'dark_oak_slab[type=top]'); W.set(0, B + 15, 2, 'candle[candles=2,lit=false]', LIT(5.2));
  // third floor: the crystal chamber; a ring of runes, the crown of crystal (group 2) through the roof
  for (let x = -4; x <= 4; x++) for (let z = -4; z <= 4; z++) { const d = Math.hypot(x, z); if (d >= 3 && d < 4.3) W.set(x, B + 24, z, 'crimson_eclipse:rune_stone', { d:5.6 }); }
  for (let x = -1; x <= 1; x++) for (let z = -1; z <= 1; z++) W.del(x, KH, z);
  const CR = 'crimson_eclipse:crimson_crystal', CL = 'crimson_eclipse:crimson_crystal_cluster', g2 = { g:2, d:5.5 };
  const spike = (x, z, y1) => { for (let y = B + 25; y <= y1; y++) W.set(x, y, z, CR, g2); W.set(x, y1 + 1, z, CL, g2); };
  spike(0, 0, KH + 8); spike(1, 0, KH + 4); spike(-1, 0, KH + 5); spike(0, 1, KH + 3); spike(0, -1, KH + 6); spike(1, 1, KH); spike(-1, -1, KH + 1);
  W.set(3, B + 25, 0, 'chest[facing=west]');
  for (const [x, z] of [[-2, 2], [2, -2], [-2, -2], [2, 2]]) W.set(x, B + 25, z, 'candle[candles=4,lit=false]', LIT(5.3));
  // courtyard: a roofed well, stables along the west wall, barrels, hay
  for (let x = 16; x <= 18; x++) for (let z = -11; z <= -9; z++) { if (x === 17 && z === -10) { W.set(x, B - 1, z, 'water'); W.set(x, B - 2, z, 'water'); W.del(x, B, z); continue; }
    W.set(x, B, z, 'mossy_cobblestone'); W.set(x, B + 4, z, 'spruce_slab'); }
  for (const x of [16, 18]) for (const z of [-11, -9]) for (let y = B + 1; y <= B + 3; y++) W.set(x, y, z, 'spruce_fence');
  for (let z = -16; z <= 10; z++) { for (let x = -21; x <= -18; x++) W.set(x, B + 4 + (-18 - x) + 3, z, `spruce_stairs[facing=west]`);
    if (z % 5 === 0) for (let y = B; y <= B + 6; y++) W.set(-18, y, z, 'spruce_fence'); }
  for (let z = -15; z <= 9; z++) { const r = hash3(-20, z, 3); if (r > .55) W.set(-20, B, z, 'hay_block'); else if (r > .4) W.set(-21, B, z, 'barrel'); if (r > .85) W.set(-20, B + 1, z, 'hay_block'); }
  for (const [x, z] of [[14, 15], [15, 15], [14, 16], [-15, 18], [-16, 18]]) W.set(x, B, z, 'barrel');
  W.set(15, B + 1, 15, 'barrel'); W.set(-14, B, 17, 'crafting_table');
  // braziers along the walkway: they catch one after the other round the walls
  const walk = []; for (let u = -16; u <= 16; u += 8) walk.push([u, -23], [23, u], [-u, 23], [-23, -u]);
  walk.forEach(([x, z], i) => { if (Math.abs(x) < 12 && z > 0) return; W.set(x, H + 1, z, 'campfire[lit=false]', LIT(4 + Math.atan2(z, x)/Math.PI*1.6 + 1.6)); });
  // ruin: the north-east tower lost its roof and top, a breach in the east wall, merlons gone, a broken keep window
  K.collapse(W, e => Math.hypot(e.x - 24, e.z + 24) < 8 && e.y > B + 11 + 5*vnoise(e.x*.3, e.y*.2, e.z*.3), RUBBLE, .3);
  K.collapse(W, e => e.x >= 21 && e.z >= -2 && e.z <= 7 && e.y > B + 2 + 7*vnoise(e.x*.3 + 4, e.y*.2, e.z*.35) + Math.abs(e.z - 2.5)*.9, RUBBLE, .45);
  K.collapse(W, e => e.id === merlon && e.y >= H + 2 && hash3(e.x, e.y, e.z) > .8, RUBBLE, .2);
  K.weather(W, { deepslate_bricks:(e, n, r) => r > .86 ? 'cracked_deepslate_bricks' : n > .74 ? 'cobbled_deepslate' : null,
    polished_blackstone_bricks:(e, n, r) => r > .85 ? 'cracked_polished_blackstone_bricks' : null });
  K.vines(W, e => e.id === WALL || e.id === 'cracked_deepslate_bricks', .02, 5);
  for (const e of [...W.M.values()]) if (e.y === B + 11 && !W.get(e.x, e.y - 1, e.z) && Math.abs(e.x) <= 10 && Math.abs(e.z) <= 10 && hash3(e.x, 4, e.z) > .9) W.set(e.x, e.y - 1, e.z, 'cobweb');
  return {
    tag:'A fortress on its hill: crenellated walls, four round towers, a gatehouse with a portcullis, and a 45-block keep (a great hall with its throne, a library, a crystal chamber). <i>Under the blood moon:</i> the portcullis rises, braziers catch one after the other round the walls, the keep doors swing open, its lanterns and windows light floor by floor, and the crystal crown on the roof lifts and fires at the sky. <i>Cut slider: look inside.</i>',
    cam:{ target:[0, 22, 4], dist:118, yaw:.62, pitch:.22 },
    sun:norm([.45, .78, .5]), moon:dirFrom(.62 + Math.PI + .35, .3),
    flat:(x, z) => Math.max(Math.hypot(x, z > 0 ? z*.62 : z) - 50, 0),
    shakeAt:3.4,
    ground(W) {     // the hill, under and around the castle; a path up to the gate
      const hr = (x, z) => Math.hypot(x, z > 0 ? z*.62 : z) - 2.5*(vnoise(x*.08, 0, z*.08) - .5)*2, hh = (x, z) => Math.round(B*(1 - ss(37, 50, hr(x, z))));
      for (let x = -56; x <= 56; x++) for (let z = -56; z <= 75; z++) { const h = hh(x, z); if (h <= 0) continue;
        let lo = h; for (const [dx, dz] of [[1,0], [-1,0], [0,1], [0,-1]]) lo = Math.min(lo, hh(x + dx, z + dz));
        for (let y = Math.max(0, lo - 2); y < h; y++) if (!W.get(x, y, z)) { const top = y === h - 1, inside = Math.max(Math.abs(x), Math.abs(z)) < 22;
          W.set(x, y, z, top ? (inside ? pick(['coarse_dirt', 'gravel', 'grass_block', 'coarse_dirt', 'podzol'], hash3(x, 7, z)) : Math.abs(x) <= 2 && z > 27 ? 'dirt_path' : 'grass_block') : y > h - 3 ? 'dirt' : 'stone'); } }
      K.deadTree(W, -14, -15, 7, 21);
      W.figure(1, B, 34);
    },
    groups(nt, t) {
      const g = [];
      g[1] = Tm(0, 7.6*ss(3.6, 6.5, nt), 0);
      const kc = ss(5.5, 7.5, nt); g[2] = M4(Tm(0, kc*2.5 + kc*.2*Math.sin(t*1.2), 0), about([.5, 0, .5], RY(spinUp(nt - 5.5, 2)*.5)));
      return g;
    },
    beams(nt, t, G) { const p = applyP(G[2], [.5, KH + 10, .5]); return [{ a:p, b:[p[0], 260, p[2]], w:1, e:ss(6.5, 8, nt) }]; },
    lights(W) {
      W.light([.5, KH + 4, .5], [5, .5, .35], 16, 5.5, 2);
      W.light([.5, B + 28, .5], [3.5, .4, .3], 10, 5.6, 2);
      for (let i = 0; i < 150; i++) W.part(-9 + hash3(i,1,5)*18, B + 1 + hash3(i,2,5)*10, -9 + hash3(i,3,5)*18, 0, hash3(i,4,5), .06, 0, 0, 1,1,1);
      for (let i = 0; i < 160; i++) { const a = hash3(i,5,5)*6.283, r = hash3(i,6,5)*1.5;
        W.part(.5 + Math.cos(a)*r, KH + 1, .5 + Math.sin(a)*r, 1, hash3(i,7,5), .12, 6, 10 + hash3(i,8,5)*12, 4, .5, .3); }
    },
    trees:[[-60,-30,12], [-66,8,14], [-58,40,11], [62,-36,12], [66,4,13], [-20,-66,12], [22,-64,13], [56,48,12]],
  };
}

// ================================================================ B · the kneeling colossus
function colossus(W) {
  const Y = 4, sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]], dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2], len = a => Math.hypot(a[0], a[1], a[2]);
  const cap = (a, b, r) => p => { const pa = sub(p, a), ba = sub(b, a), h = Math.max(0, Math.min(1, dot(pa, ba)/dot(ba, ba))); return len([pa[0]-ba[0]*h, pa[1]-ba[1]*h, pa[2]-ba[2]*h]) - r; };

      W.figure(1, 0, 44);
    },
    groups(nt, t) {
      const g = [], kc = ss(5.4, 7, nt), kr = ss(7, 9.5, nt);
      g[2] = M4(Tm(0, kc*1.2 + kc*.15*Math.sin(t*1.4), 0), about([.5, 0, -.5], RY(spinUp(nt - 5.4, 2)*.6)));
      g[1] = about([.5, RC + .5, 0], RZ(spinUp(nt - 7, 2.5)*.35));
      return g;
    },
    beams(nt, t, G) { const p = applyP(G[2], [.5, TOP + 7, -.5]), c = [.5, RC + .5, 0], m = dirFrom(Math.PI + .12, .3);
      return [{ a:p, b:c, w:.9, e:ss(6.2, 7.2, nt) }, { a:c, b:[c[0] + m[0]*300, c[1] + m[1]*300, c[2] + m[2]*300], w:1.3, e:ss(9, 10.5, nt) }]; },
    lights(W) {
      W.light([.5, TOP + 4, -.5], [5, .5, .35], 12, 5.4, 2);
      W.light([.5, RC + .5, 0], [4, .4, .3], 16, 9);
      for (let i = 0; i < 160; i++) W.part(-16 + hash3(i,1,7)*32, 1 + hash3(i,2,7)*7, -16 + hash3(i,3,7)*32, 0, hash3(i,4,7), .06, 0, 0, 1,1,1);
      for (let i = 0; i < 150; i++) W.part(-6 + hash3(i,5,7)*12, 3 + hash3(i,6,7)*20, 10 + hash3(i,7,7)*18, 1, hash3(i,8,7), .09, 5, 3 + hash3(i,9,7)*4, 4, .7, .3);
    },
    trees:[[-50,-40,12], [-56,0,14], [-48,40,11], [50,-44,12], [58,-4,13], [-30,-60,12], [30,-58,13], [50,40,12]],
  };
}

// ================================================================ the page
function variant(key, short, name, build) {
  return { key, short, name, make(W) {
    const meta = build(W);
    meta.size = K.sizeOf(W);
    if (meta.ground && build === citadel) meta.ground(W);
    K.terrain(W, meta.flat);
    if (meta.ground && build !== citadel) meta.ground(W);
    for (const [x, z, h] of meta.trees) K.spruce(W, x, z, h);
    meta.lights(W);
    return meta;
  } };
}
