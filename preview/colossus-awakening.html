<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colossus Awakening</title>
<!--
  The Kneeling Colossus waking under the blood moon: stagings to pick from (round 2: D and E, made of what Bastien kept from round 1's A, B and C, which are in git history) (vault/04 - Design/Structures.md).
  The colossus is the real one (preview/structures/kneeling-colossus.js, what generates in the game); only the
  awakening changes: when each part lights, what moves, the beams, the particles. Press "Blood moon", then "Replay".
  URL parameters: ?v=d|e  &night=1  &ui=0  &spin=0
-->
</head>
<body>
<script src="vanilla/textures.js" onerror="void 0"></script>
<script src="lib/blocks.js"></script>
<script src="lib/world.js"></script>
<script src="lib/textures.js"></script>
<script src="lib/viewer.js"></script>
<script src="structures/kit.js"></script>
<script src="structures/kneeling-colossus.js"></script>
<script>
'use strict';
const K = CE.kit, build = CE.structures.kneelingColossus;
const { ss, hash3 } = CE.math, { M4, Tm, Sm, RX, RY, about, applyP, norm } = CE.m;
const Y = 4, HEART = [.5, Y + 30.5, -.5], NECK = [.5, Y + 39, .5], HEAD = [.5, Y + 44, 2.5];
const lerp = (a, b, k) => a.map((v, i) => v + (b[i] - v)*k);
const add = (a, b, k = 1) => a.map((v, i) => v + b[i]*k);

// the colossus as it generates, its blocks sorted by what they are
function colossus(W) {
  const meta = build(W);
  meta.size = K.sizeOf(W);
  K.terrain(W, meta.flat);
  meta.ground(W);
  for (const [x, z, h] of meta.trees) K.spruce(W, x, z, h);
  const all = [...W.M.values()], is = id => e => e.id === id;
  const P = {
    heart: all.filter(e => e.g === 2),
    crown: all.filter(e => e.g === 1 && e.id.startsWith('crimson_eclipse:crimson_crystal')),
    eyes: all.filter(is('crimson_eclipse:helm_eye')),
    veins: all.filter(is('crimson_eclipse:crimson_vein')),
    sword: all.filter(e => !e.g && e.id === 'crimson_eclipse:crimson_crystal' && e.z === 15),
    lanterns: all.filter(is('crimson_eclipse:vigil_lantern')),
    fires: all.filter(e => e.id === 'campfire' && e.y > Y),
    candles: all.filter(e => e.id === 'candle'),
  };
  P.eyeAt = P.eyes.map(e => [e.x + .5, e.y + .5, e.z]);
  P.crownTop = [.5, Math.max(...P.crown.map(e => e.y)) + 1, 2.5];
  P.swordTip = [.5, Math.max(...P.sword.map(e => e.y)) + 1, 15.5];
  delete meta.shakeAt;
  return { meta, P };
}
// a ring of rune stones (and spokes) set into the dais floor, lit by `delay(angle)`
function runes(W, delay) {
  const cells = [];
  for (let x = -22; x <= 22; x++) for (let z = -22; z <= 22; z++) { const r = Math.hypot(x, z), a = (Math.atan2(x, z) + Math.PI*2) % (Math.PI*2);
    const ring = Math.abs(r - 13.5) < .55, spoke = r > 10 && r < 18 && Math.abs(((a/(Math.PI/4)) % 1) - .5) > .46;
    if (!(ring || spoke) || !W.get(x, Y - 1, z) || W.get(x, Y, z)) continue;
    const d = delay(a, r);
    W.set(x, Y - 1, z, ring ? 'crimson_eclipse:crimson_vein' : 'crimson_eclipse:rune_stone', { d }); cells.push([x, z]);
    if (ring) for (let k = 0; k < 2; k++) W.part(x + .5, Y, z + .5, 1, hash3(x, z, k), .09, d, 2.5 + hash3(z, x, k)*3, 4, .55, .3); }
  return cells;
}
// the heart's beat: its phase for a beat rate (beats a second) that changes with the night's time
function beater(rate) { let memo = [-1, 0];
  return nt => { if (Math.abs(nt - memo[0]) < 1e-4) return memo[1]; let ph = 0; for (let s = 0; s < nt; s += .02) ph += rate(s)*.02; memo = [nt, ph]; return ph; }; }
const thump = ph => { const f = ph % 1; return Math.pow(Math.max(Math.cos(f*Math.PI*2), 0), 30) + .55*Math.pow(Math.max(Math.cos((f - .17)*Math.PI*2), 0), 30); };
// the head: lifted by `lift` (radians up) and turned by `turn` (radians toward +x)
const head = (lift, turn = 0) => about(NECK, M4(RY(turn), RX(-lift)));
const towards = (eye, from = NECK) => [Math.atan2(eye[0] - from[0], eye[2] - from[2]), Math.atan2(eye[1] - from[1], Math.hypot(eye[0] - from[0], eye[2] - from[2]))];
const clamp = (v, a) => Math.max(-a, Math.min(a, v));

// what Bastien kept from round 1 (A, B, C), shared by D and E
const motes = W => { for (let i = 0; i < 160; i++) W.part(-12 + hash3(i,1,6)*24, Y + 1 + hash3(i,2,6)*30, -10 + hash3(i,3,6)*28, 0, hash3(i,4,6), .07, 0, 0, 1,1,1); };
// red mist rolling round the dais (C)
const mist = (W, d) => { for (let i = 0; i < 300; i++) { const a = hash3(i,1,11)*6.283, r = 17 + hash3(i,2,11)*18;
  W.part(.5 + Math.sin(a)*r, Y + .3 + hash3(i,3,11)*.8, .5 + Math.cos(a)*r, 6, hash3(i,4,11), 2.4 + hash3(i,5,11)*1.8, d + hash3(i,6,11)*1.5, 2.5, .8, .1, .09); } };
// eight shards hidden in the helm by day, flung out at `d` to circle the head (C), group 3
function halo(W, d) {
  for (let i = 0; i < 8; i++) { const a = i/8*Math.PI*2, x = Math.round(Math.sin(a)*9), z = Math.round(Math.cos(a)*9) + 2, y = Y + 50 + (i % 2);
    W.set(x, y, z, 'crimson_eclipse:crimson_crystal', { g:3, d }); W.set(x, y + 1, z, 'crimson_eclipse:crimson_crystal_cluster', { g:3, d }); }
  for (let i = 0; i < 140; i++) W.part(HEAD[0], HEAD[1], HEAD[2], 5, hash3(i,3,13), .15, d, 8 + hash3(i,4,13)*6, 5, .8, .4);
  return (nt, t) => { const o = ss(d, d + 2, nt); return M4(Tm(0, .6*Math.sin(t*1.3)*o, 0), about(HEAD, M4(RY(t*.45), Sm(Math.max(o, .001))))); };
}
// sparks rising along the blade as it fills (A), `delay(y)` for each height
const bladeSparks = (W, delay) => { for (let y = Y; y <= Y + 25; y++) for (let k = 0; k < 3; k++) W.part(.5 + (hash3(y, k, 21) - .5)*2.4, y, 15.5 + (hash3(k, y, 22) - .5)*1.4, 1, hash3(y, k, 23), .08, delay(y), 3 + hash3(y, k, 24)*4, 4, .6, .3); };
const thumpAfter = (beat, from) => nt => nt < from ? 0 : thump(beat(nt));
// the beam from the red moon down onto the crown (B, Bastien's favourite): it reaches down from `from` over 2 s, then stays
function moonBeam(meta, P, from, thin) {
  return (nt, t, G) => { if (nt < from) return [];
    const m = meta.moon, sky = add(P.crownTop, m, 420), a = applyP(G[1], P.crownTop);
    return [{ a:sky, b:lerp(sky, a, ss(from, from + 2, nt)), w:2.2 - (2.2 - thin)*ss(thinFrom(from), thinFrom(from) + 4, nt) + .15*Math.sin(t*3), e:ss(from, from + .4, nt) }]; };
}
const thinFrom = from => from + 7;

CE.viewer({ dayLabel:'Day: a ruin', variants:[

// ---------------------------------------------------------------- D: B's moon and light, A's heart, C's mist and halo
{ key:'D', short:"The Moon's Gift", name:"D · The Moon's Gift", make(W) {
  const { meta, P } = colossus(W);
  const top = P.crownTop[1], down = e => 5 + (top - e.y)*.11;
  const beat = beater(nt => nt < 10 ? 0 : 1.05), th = thumpAfter(beat, 10);
  P.crown.forEach(e => e.d = 5 + hash3(e.x, e.y, e.z)*.3);
  P.eyes.forEach(e => e.d = 6.2);
  P.veins.forEach(e => e.d = down(e) + hash3(e.x, e.y, e.z)*.4);
  P.lanterns.forEach(e => e.d = down(e));
  P.heart.forEach(e => e.d = 10);
  P.sword.forEach(e => e.d = 12.5 + (Y + 25 - e.y)*.06);
  P.candles.forEach(e => e.d = 14 + hash3(e.x, e.y, e.z));
  P.fires.forEach(e => e.d = 16);
  runes(W, a => 13.5 + a/(Math.PI*2)*2.4);
  const ring = halo(W, 17.5);
  W.light(P.crownTop, [4.5, .45, .35], 13, 5, 1);
  W.light(HEART, [6, .6, .4], 13, 10, 2);
  W.light([.5, Y + 10, 16.5], [3.5, .35, .25], 10, 12.5);
  W.light([.5, Y + 1, .5], [4, .4, .3], 22, 13.5);
  W.light(HEAD, [4, .4, .3], 14, 17.5, 1);
  motes(W); mist(W, 13.5); bladeSparks(W, y => 12.5 + (Y + 25 - y)*.06);
  P.fires.forEach((e, k) => { for (let i = 0; i < 26; i++) W.part(e.x + .5, e.y + .8, e.z + .5, 1, hash3(k, i, 3), .13, 16, 9 + hash3(i, k, 4)*7, 5, 1.1, .3); });
  return { ...meta, tag:"<b>B's moon, A's heart, C's halo.</b> A beam comes down from the red moon onto the crown and stays all night; the light runs down him from the top. It reaches the heart, which takes the light in one great beat and keeps beating. The sword fills from the guard down, sparks running up the blade; the ring round the dais lights and red mist rolls over it; the braziers flare. Eight shards burst from his helm to circle his head in the beam, and he lifts his face to the moon.",
    phases:[[0, 'Nightfall'], [3, 'The moon reaches down'], [5, 'Light pours into him'], [10, 'His heart takes it'], [12.5, 'The sword fills'], [13.5, 'The ring wakes, the mist rolls'], [16, 'The braziers flare'], [17.5, 'The shards rise'], [19.5, 'Awake under the blood moon']],
    shakes:[[5, .3], [10, .6], [17.5, .3]],
    glow(nt, t) { return { g:.8 + .65*th(nt) + .1*Math.sin(t*2.2)*(nt < 10 ? 1 : 0) }; },
    groups(nt, t) { const g = [];
      g[1] = head(.2*ss(6.2, 8, nt) + .38*ss(17.5, 21, nt) + .012*Math.sin(t*.8)*ss(21, 22, nt));
      g[2] = about(HEART, Sm(1 + .25*Math.exp(-Math.max(nt - 10, 0)*3)*ss(9.9, 10, nt) + .14*th(nt)));
      g[3] = ring(nt, t); return g; },
    beams:moonBeam(meta, P, 3, 1.1) };
} },

// ---------------------------------------------------------------- E: A's heart and sword, C's mist, gaze and halo, B's ring and moon beam as the finale
{ key:'E', short:'The Heart Guardian', name:'E · The Heart Guardian', make(W) {
  const { meta, P } = colossus(W);
  const beat = beater(nt => nt < 5 ? 0 : .55 + 1.1*ss(5.5, 10, nt) - .5*ss(11, 14, nt)), th = thumpAfter(beat, 5);
  runes(W, a => 3.5 + a/(Math.PI*2)*3);
  P.heart.forEach(e => e.d = 5);
  P.veins.forEach(e => e.d = 6 + Math.hypot(e.x - HEART[0], e.y - HEART[1], e.z - HEART[2])*.1);
  P.fires.forEach((e, i) => e.d = 9 + i*.2);
  P.lanterns.forEach(e => e.d = 10 + hash3(e.x, e.y, e.z));
  P.candles.forEach(e => e.d = 10.5 + hash3(e.x, e.y, e.z));
  P.eyes.forEach(e => e.d = 12);
  P.sword.forEach(e => e.d = 15 + (e.y - Y)*.085);
  P.crown.forEach(e => e.d = 19 + hash3(e.x, e.y, e.z)*.4);
  const ring = halo(W, 20);
  W.light(HEART, [6, .6, .4], 13, 5, 2);
  W.light([.5, Y + 1, .5], [3.5, .35, .28], 22, 3.5);
  W.light([.5, Y + 10, 16.5], [3.5, .35, .25], 10, 15);
  W.light(HEAD, [4, .4, .3], 14, 19, 1);
  motes(W); mist(W, 2); bladeSparks(W, y => 15 + (y - Y)*.085);
  for (let i = 0; i < 180; i++) { const a = hash3(i,5,12)*6.283, r = 6 + hash3(i,6,12)*10; W.part(.5 + Math.sin(a)*r, Y + 4 + hash3(i,9,12)*20, -.5 + Math.cos(a)*r, 1, hash3(i,7,12), .1, 9, 14 + hash3(i,8,12)*14, 4, .7, .3); }
  return { ...meta, tag:"<b>The heart first, the moon last.</b> Red mist rolls round the dais and the ring of runes turns. Then one beat in the dark chest shakes the ground; the beats quicken, the heart swells with each, and the veins catch from the heart outward. The braziers take, his eyes open, he lifts his head and <i>follows you</i> (turn the view: he keeps looking, no laser). The sword fills from the ground up, sparks running up the blade. Last, the red moon reaches down to him: its beam lands on the crown, the crown burns, and eight shards burst from his helm to circle his head.",
    phases:[[0, 'Nightfall'], [2, 'Red mist rolls in'], [3.5, 'The ring of runes turns'], [5, 'A single beat'], [6, 'The heart quickens'], [9, 'The braziers take'], [12, 'His eyes open'], [13.5, 'He looks at you'], [15, 'The sword fills'], [17, 'The moon reaches down'], [20, 'The shards rise'], [22, 'Awake: he watches']],
    shakes:[[5, .55], [12, .3], [19, .4]],
    glow(nt) { return { g:.75 + .7*th(nt) }; },
    groups(nt, t, eye) { const g = [], [a, p] = towards(eye), k = ss(13.5, 15.5, nt);
      g[1] = head(.3*ss(12.5, 15, nt) + k*clamp(p - .05, .35), k*clamp(a, 1.1));
      g[2] = about(HEART, Sm(1 + .16*th(nt)));
      g[3] = ring(nt, t); return g; },
    beams:moonBeam(meta, P, 17, 1.3) };
} },
] });
</script>
</body>
</html>
