<title>Abandoned Building</title>
<!--
  Preview of the first structure (vault/04 - Design/Structures.md): a big abandoned building, three candidates.
  Each one is shown by day (a ruin) and under the blood moon (it wakes up).
  Real Minecraft blocks only, each in exactly one cell (preview/lib: the shared block engine). Our own blocks are
  crimson_eclipse:*; moving parts are blocks (or anchor models) that sit on the grid at rest.
  Real vanilla textures: "Load real textures…" (your own client jar) or preview/vanilla/textures.js; painted stand-ins otherwise.
  URL parameters: ?v=a|b|c  &night=1  &ui=0  &spin=0
-->
</head>
<body>
<script src="vanilla/textures.js" onerror="void 0"></script>
<script src="lib/blocks.js"></script>
<script src="lib/world.js"></script>
<script src="lib/textures.js"></script>
<script src="lib/viewer.js"></script>
<script>
'use strict';
const { hash3, vnoise, ss } = CE.math, K = CE.kit;
const { M4, Tm, Sm, RX, RY, RZ, about, applyP, applyD, spinUp, norm, dirFrom } = CE.m;
const pick = (list, r) => list[Math.floor(r*list.length) % list.length];
const RUBBLE = e => pick(['cobblestone', 'gravel', 'cobblestone', 'mossy_cobblestone', 'andesite'], hash3(e.x, e.y*3, e.z));
const isRoof = e => e.id.startsWith('deepslate_tile');

// ================================================================ A · the chapel
function chapel(W) {
  const STONE = 'stone_bricks', TRIM = 'polished_blackstone_bricks', HEAD = 'chiseled_stone_bricks', GLASS = 'crimson_eclipse:eclipse_glass';
  const yr = x => 15 + Math.round((7 - Math.abs(x))*1.6);
  for (let x = -7; x <= 7; x++) for (let z = -26; z <= 16; z++) W.set(x, 0, z, ((x + z) & 1) ? 'polished_blackstone' : 'polished_diorite');
  // nave walls, windows (our eclipse glass: it lights from the altar to the door), buttresses with stair caps
  for (let z = -18; z <= 14; z++) for (let y = 1; y <= 14; y++) { W.set(-7, y, z, STONE); W.set(7, y, z, STONE); }
  for (const zc of [-14, -8, -2, 4, 10]) for (const sx of [-7, 7]) {
    const d = 3.8 + (zc + 14)*.055 + (sx > 0 ? .08 : 0);
    for (let dz = -1; dz <= 1; dz++) { for (let y = 3; y <= 10; y++) W.set(sx, y, zc+dz, GLASS, { d }); W.set(sx, 2, zc+dz, TRIM); }
    W.set(sx, 11, zc, GLASS, { d }); W.set(sx, 11, zc-1, HEAD); W.set(sx, 11, zc+1, HEAD); W.set(sx, 12, zc, HEAD);
  }
  for (const zp of [-17, -11, -5, 1, 7, 13]) for (const s of [-1, 1]) {
    const inward = s < 0 ? 'east' : 'west';
    for (let y = 1; y <= 12; y++) W.set(s*8, y, zp, STONE);
    for (let y = 1; y <= 8; y++) W.set(s*9, y, zp, STONE);
    for (let y = 1; y <= 4; y++) W.set(s*10, y, zp, STONE);
    W.set(s*8, 13, zp, `stone_brick_stairs[facing=${inward}]`); W.set(s*9, 9, zp, `stone_brick_stairs[facing=${inward}]`); W.set(s*10, 5, zp, `stone_brick_stairs[facing=${inward}]`);
    if (hash3(zp, s, 1) > .3) W.set(s*8, 14, zp, 'polished_blackstone_brick_wall');
  }
  // steep roof: tiles, the top of each column a stair facing the ridge, a crest of wall posts
  for (let z = -18; z <= 14; z++) for (let x = -7; x <= 7; x++) {
    const a = yr(x), b = x ? yr(Math.abs(x) - 1) : a + 1, top = Math.max(b, a + 1) - 1;
    for (let y = a; y <= top; y++) W.set(x, y, z, y === top && x ? `deepslate_tile_stairs[facing=${x < 0 ? 'east' : 'west'}]` : 'deepslate_tiles');
    if (x === 0 && (z & 1)) W.set(0, a + 1, z, 'deepslate_tile_wall');
  }
  for (let x = -7; x <= 7; x++) for (let y = 14; y < yr(x); y++) W.set(x, y, -19, STONE);
  // facade: gable, pilasters with pinnacles, pointed door, rose window with the eye
  for (let x = -7; x <= 7; x++) for (let y = 1; y <= yr(x); y++) { W.set(x, y, 15, STONE); W.set(x, y, 16, STONE); }
  for (const s of [-1, 1]) { for (let y = 1; y <= 19; y++) { W.set(s*8, y, 15, STONE); W.set(s*8, y, 16, STONE); }
    W.set(s*8, 20, 16, TRIM); W.set(s*8, 21, 16, 'polished_blackstone_brick_wall'); W.set(s*8, 22, 16, 'polished_blackstone_brick_wall'); }
  const door = (x, y) => (Math.abs(x) <= 2 && y >= 1 && y <= 6) || (Math.abs(x) <= 1 && y === 7) || (x === 0 && y === 8);
  for (let x = -3; x <= 3; x++) for (let y = 1; y <= 9; y++) {
    if (door(x, y)) { W.del(x, y, 15); W.del(x, y, 16); }
    else if (door(x + Math.sign(x), y) || door(x, y - 1)) W.set(x, y, 16, TRIM);
  }
  for (let x = -6; x <= 6; x++) for (let y = 9; y <= 21; y++) { const r = Math.hypot(x, y - 15); if (r > 5.3) continue;
    for (const z of [15, 16]) { const a = Math.atan2(y - 15, x);
      if (r > 4.4) W.set(x, y, z, TRIM);
      else if (r < 1.7) W.set(x, y, z, 'crimson_eclipse:eclipse_eye', { d:4.3 });
      else if (Math.abs(Math.sin(a*4)) < .24) W.set(x, y, z, TRIM);
      else W.set(x, y, z, GLASS, { d:4.15 }); } }
  // the door leaves: one fallen flat on the grass (trapdoors), one swung open inside (open trapdoors stacked)
  for (const x of [-2, -1]) for (let z = 18; z <= 21; z++) if (hash3(x, z, 2) > .15) W.set(x, 0, z, 'dark_oak_trapdoor[half=bottom]');
  for (let y = 1; y <= 6; y++) for (const z of [13, 14]) W.set(2, y, z, 'dark_oak_trapdoor[open=true,facing=west]');
  // bell tower (front left)
  for (let y = 0; y <= 30; y++) for (let x = -13; x <= -9; x++) for (let z = 14; z <= 18; z++) {
    const edge = x === -13 || x === -9 || z === 14 || z === 18; if (!edge && y > 0) continue;
    const mid = (x > -13 && x < -9) || (z > 14 && z < 18), corner = !mid;
    if (y >= 21 && y <= 26 && !corner) continue;                                 // belfry openings
    if (((y >= 8 && y <= 10) || (y >= 15 && y <= 17)) && ((x === -11 && (z === 14 || z === 18)) || (z === 16 && (x === -13 || x === -9)))) { W.set(x, y, z, GLASS, { d:9 }); continue; }
    W.set(x, y, z, y === 20 || y === 30 ? TRIM : STONE);
  }
  for (const [x, z] of [[-13,14], [-9,14], [-13,18], [-9,18]]) { W.set(x, 31, z, TRIM); W.set(x, 32, z, 'polished_blackstone_brick_wall'); W.set(x, 33, z, 'polished_blackstone_brick_wall'); }
  K.pyramid(W, -11, 16, 31, [2, 2, 2, 1, 1, 1, 0, 0, 0, 0], 'deepslate_tiles', 'deepslate_tile_stairs');
  for (let x = -12; x <= -10; x++) W.set(x, 26, 16, 'dark_oak_log[axis=x]');               // the bell's beam
  W.set(-11, 25, 16, 'bell[attachment=ceiling,facing=north]', { parts:{ body:1 } });
  // apse with tall slits and a half dome
  for (let x = -8; x <= 8; x++) for (let z = -27; z <= -19; z++) { const r = Math.hypot(x, z + 18.5), a = Math.atan2(z + 18.5, x);
    if (r >= 6.5 && r < 7.6) for (let y = 1; y <= 13; y++) {
      const slit = y >= 4 && y <= 10 && [-Math.PI/2, -Math.PI/4, -3*Math.PI/4].some(s => Math.abs(a - s) < .12);
      W.set(x, y, z, slit ? GLASS : STONE, { d:3.7 }); }
    for (let y = 14; y <= 21; y++) { const rr = 7.1*Math.sqrt(Math.max(0, 1 - ((y - 14)/7.6)**2)); if (r >= rr - 1.25 && r < rr) W.set(x, y, z, 'deepslate_tiles'); } }
  // altar with candles (lit one by one under the blood moon), banners, the loot chest
  W.box(-2, 1, -23, 2, 1, -22, TRIM);
  for (let x = -2; x <= 2; x++) for (const z of [-23, -22]) { const i = (x + 2)*2 + (z + 23);
    if (hash3(x, z, 7) > .25) W.set(x, 2, z, `candle[candles=${1 + Math.floor(hash3(x, z, 8)*4)},lit=false]`, { awake:{ lit:true }, d:3.6 + i*.08 }); }
  W.set(0, 6, -24, 'red_wall_banner[facing=south]'); W.set(-2, 6, -24, 'black_wall_banner[facing=south]'); W.set(2, 6, -24, 'black_wall_banner[facing=south]');
  W.set(0, 1, -20, 'chest[facing=south]', { parts:{ lid:3 } });
  // pews (stairs, the backrest towards the door), the carpet, banners on the walls
  for (let z = -15; z <= 9; z += 3) for (const xs of [[-6, -3], [3, 6]]) { const r = hash3(z, xs[0], 5);
    if (r < .2) continue;
    for (let x = xs[0]; x <= xs[1]; x++) { if (r < .38) { if (hash3(x, z, 6) > .5) W.set(x, 1, z, 'dark_oak_slab'); continue; }
      W.set(x, 1, z, 'dark_oak_stairs[facing=south]'); } }
  for (let z = -18; z <= 14; z++) for (let x = -1; x <= 1; x++) if (hash3(x, z, 77) > .22 && Math.abs(z + 1) > 3) W.set(x, 1, z, 'red_carpet');
  for (const zb of [-11, -5, 1, 7]) for (const s of [-1, 1]) if (hash3(zb, s, 31) > .35) W.set(s*6, 8, zb, `red_wall_banner[facing=${s < 0 ? 'east' : 'west'}]`);
  // the crater and the crimson crystal that broke through the roof (group 2: it lifts and turns)
  for (let x = -4; x <= 4; x++) for (let z = -5; z <= 3; z++) { const r = Math.hypot(x, z + 1);
    if (r < 2.7) { W.del(x, 0, z); W.del(x, 1, z); W.set(x, -1, z, RUBBLE({ x, y:-1, z })); W.set(x, -2, z, 'dirt'); }
    else if (r < 3.9 && hash3(x, 1, z) > .45) W.set(x, 1, z, RUBBLE({ x, y:1, z })); }
  const CR = 'crimson_eclipse:crimson_crystal', CL = 'crimson_eclipse:crimson_crystal_cluster', g2 = { g:2 };
  const spike = (x, z, y0, y1) => { for (let y = y0; y <= y1; y++) W.set(x, y, z, CR, g2); W.set(x, y1 + 1, z, CL, g2); };
  spike(0, -1, 0, 6); spike(-1, -1, 0, 4); spike(0, -2, 0, 3); spike(-1, -2, 0, 5);
  spike(1, -1, 0, 2); spike(-2, -2, 0, 1); spike(0, 0, 0, 1); spike(-1, -3, 0, 2);
  // ruin: roof hole above the crystal, broken windows, a collapsed corner, a fallen spire tip
  K.collapse(W, e => isRoof(e) && e.z >= -19 && e.y >= 15 && Math.hypot(e.x*.7, e.z + 1) < 5.8 + 3.6*(vnoise(e.x*.25, e.y*.25, e.z*.25) - .5)*2, RUBBLE);
  K.collapse(W, e => e.y >= 11 && Math.abs(e.x) === 7 && Math.abs(e.z + 1) < 4 && vnoise(e.x*.3, e.y*.3, e.z*.3) > .4, RUBBLE);
  K.collapse(W, e => e.id === GLASS && Math.abs(e.x) === 7 && vnoise(e.x*.4 + 9, e.y*.35, e.z*.4) > .56, 'gravel', .1);
  K.collapse(W, e => e.x >= 3 && e.x <= 8 && e.z >= 15 && e.y >= 17 && vnoise(e.x*.3, e.y*.3, e.z*.3) > .38, RUBBLE);
  K.collapse(W, e => e.x > 6 && e.z >= 5 && e.z <= 11 && e.y > 7 && e.y < 15 && vnoise(e.x*.3 + 5, e.y*.3, e.z*.3) > .45, RUBBLE);
  K.collapse(W, e => e.y >= 38 && e.x < -8 && e.z > 13, 'deepslate_tiles');
  // what is left of the roof frame: tie beams, and rafters where the tiles fell
  for (const z of [-6, -3, 0, 3]) { const brk = hash3(z, 9, 9), len = brk > .5 ? 13 : 5 + Math.floor(brk*6);
    for (let x = -6; x <= -6 + len - 1; x++) if (!W.get(x, 14, z)) W.set(x, 14, z, 'dark_oak_log[axis=x]');
    for (let x = -6; x <= 6; x++) if (!W.get(x, yr(x), z) && !W.get(x, yr(x) - 1, z) && hash3(x, z, 4) > .35) W.set(x, yr(x) - 1, z, 'dark_oak_log[axis=x]'); }
  // a tree grew inside, through the hole
  for (let y = 1; y <= 12; y++) W.set(4, y, -5, 'dark_oak_log');
  for (const [x, y, z, ax] of [[5,9,-5,'x'], [6,10,-5,'x'], [3,10,-6,'z'], [3,11,-6,'y'], [4,11,-4,'z']]) W.set(x, y, z, `dark_oak_log[axis=${ax}]`);
  for (let x = -1; x <= 9; x++) for (let y = 10; y <= 17; y++) for (let z = -10; z <= 0; z++)
    if (Math.hypot(x - 4, (y - 13.5)*1.2, z + 5) < 3.8 && hash3(x, y, z) > .28 && !W.get(x, y, z)) W.set(x, y, z, 'dark_oak_leaves');
  K.weather(W, { stone_bricks:(e, n, r) => n > .72 - (e.y < 4 ? .2 : 0) ? 'mossy_stone_bricks' : r > .88 ? 'cracked_stone_bricks' : null,
    polished_blackstone_bricks:(e, n, r) => r > .85 ? 'cracked_polished_blackstone_bricks' : null });
  K.vines(W, e => e.id.includes('stone_bricks'), .018, 1);
  // graveyard on the right: headstones (walls), crosses (walls), mounds, an iron fence
  for (let i = 0; i < 16; i++) { const x = 13 + (i % 4)*3 + Math.round(hash3(i, 1, 1)), z = -13 + Math.floor(i/4)*5 + Math.round(hash3(i, 2, 1)*2);
    W.set(x, -1, z + 1, hash3(i, 4, 4) > .5 ? 'podzol' : 'coarse_dirt');
    if (hash3(i, 3, 3) < .5) { W.set(x, 0, z, hash3(i, 5, 5) > .5 ? 'mossy_stone_brick_wall' : 'stone_brick_wall'); }
    else { for (let y = 0; y <= 2; y++) W.set(x, y, z, 'cobblestone_wall'); W.set(x - 1, 1, z, 'cobblestone_wall'); W.set(x + 1, 1, z, 'cobblestone_wall'); } }
  for (let x = 11; x <= 26; x++) for (const z of [-16, 9]) if (hash3(x, z, 9) > .1) W.set(x, 0, z, x % 5 === 1 ? 'polished_blackstone_wall' : 'iron_bars');
  K.deadTree(W, 20, -3, 8, 4);
  W.figure(4, 0, 20);
  return {
    tag:'A tall gothic chapel, roof caved in by a crimson crystal that fell from the sky long ago. <i>Under the blood moon:</i> the crystal lifts and turns, a red pillar rises through the hole, the altar candles light one by one, the eclipse glass lights from the altar to the door, the rose window opens like an eye, the bell swings and the chest by the altar opens.',
    cam:{ target:[-1, 12, -3], dist:78, yaw:.72, pitch:.2 },
    sun:norm([.45, .78, .5]), moon:dirFrom(.72 + Math.PI + .32, .26),
    flat:(x, z) => Math.max(Math.abs(x + 2) - 30, Math.abs(z + 4) - 30, 0),
    shakeAt:3.2,
    groups(nt, t) {
      const g = [];
      const kb = ss(4.6, 6.2, nt); g[1] = about([-10.5, 26, 16.5], RX(kb*.62*Math.sin(t*2.3) + (1 - kb)*.012*Math.sin(t*.7)));
      const kc = ss(3.2, 5.5, nt); g[2] = M4(Tm(0, kc*1.6 + kc*.18*Math.sin(t*1.3), 0), about([0, 0, -1], M4(RY(spinUp(nt - 3.2, 2)*.45), RX((1 - kc)*.0))));
      g[3] = about([.5, 1 + 9/16, -20 + 1/16], RX(-ss(5, 6.5, nt)*1.15));
      return g;
    },
    beams(nt, t, G) { const p = applyP(G[2], [0, 8, -1]); return [{ a:p, b:[p[0], 200, p[2]], w:1.1, e:ss(4.0, 5.5, nt) }]; },
    lights(W) {
      W.light([0, 3, -1], [4.5, .45, .32], 13, 3.2, 2);
      W.light([0, 14, 20], [3.4, .34, .26], 13, 4.4);
      for (let i = 0; i < 230; i++) W.part(-6 + hash3(i,1,2)*12, 1 + hash3(i,2,2)*13, -17 + hash3(i,3,2)*30, 0, hash3(i,4,2), .07, 0, 0, 1,1,1);
      for (let i = 0; i < 200; i++) { const a = hash3(i,5,2)*6.283, r = hash3(i,6,2)*2.6;
        W.part(Math.cos(a)*r, .5, -1 + Math.sin(a)*r, 1, hash3(i,7,2), .12 + hash3(i,8,2)*.1, 3.5, 14 + hash3(i,9,2)*14, 4, .5, .3); }
    },
    trees:[[-44,-28,12], [-50,0,14], [-40,34,11], [46,-38,12], [54,-6,13], [-14,-54,12], [16,-52,13], [-32,-46,10]],
  };
}

// ================================================================ B · the observatory
function observatory(W) {
  const F = 4, D = F + 14, P = [0, D + 1, 0], A = [-14, F + 4, 7], GLASS = 'crimson_eclipse:eclipse_glass';
  const moon = dirFrom(-.62, .27), az = Math.atan2(moon[0], moon[2]), el = Math.asin(moon[1]);
  // rock platform, stairs up, two candle posts
  for (let x = -26; x <= 28; x++) for (let z = -26; z <= 26; z++) {
    const rr = Math.hypot(x*(x > 0 ? .8 : 1), z*1.08), edge = 22 + 2.6*(vnoise(x*.15, 0, z*.15) - .5)*2;
    if (rr >= edge) continue; const top = rr < edge - 2 ? 3 : rr < edge - 1 ? 2 : 1;
    for (let y = 0; y <= top; y++) W.set(x, y, z, hash3(x, y, z) > .8 ? 'andesite' : 'stone');
    if (top === 3 && rr < edge - 3.5) W.set(x, 3, z, ((x + z) & 1) ? 'deepslate_tiles' : 'polished_andesite');
  }
  for (let z = -28; z <= -18; z++) for (let x = -2; x <= 2; x++) { const h = Math.min(3, z + 24);
    for (let y = 0; y <= 6; y++) W.del(x, y, z);
    for (let y = 0; y <= h; y++) W.set(x, y, z, y === h ? (h === 3 ? 'polished_andesite' : 'polished_andesite_stairs[facing=south]') : 'stone'); }
  for (const s of [-3, 3]) { for (let y = 0; y <= 2; y++) W.set(s, y, -24, 'polished_blackstone_wall');
    W.set(s, 3, -24, 'candle[candles=3,lit=false]', { awake:{ lit:true }, d:s < 0 ? 3.2 : 3.3 }); }
  // rotunda: pilasters, eclipse-glass windows (they light round the drum), door, cornice, a gallery floor
  for (let x = -11; x <= 11; x++) for (let z = -11; z <= 11; z++) {
    const r = Math.hypot(x, z), a8 = Math.atan2(z, x)*4/Math.PI, fr = a8 - Math.floor(a8);
    const pil = Math.abs(fr - .5) < .1, win = Math.min(fr, 1 - fr) < .11, k = Math.round(a8);
    if (r >= 8.5 && r < (pil ? 10.6 : 9.6)) for (let y = F; y <= F + 13; y++) {
      let t = pil ? 'polished_andesite' : 'deepslate_bricks';
      if (y === F + 13) t = 'polished_blackstone_bricks';
      else if (win && !pil && r < 9.6) {
        if (k === -2 || k === 0) { if (y <= F + 5) continue; if (y === F + 6) t = 'polished_blackstone_bricks'; }
        else if (y >= F + 3 && y <= F + 10) { W.set(x, y, z, GLASS, { d:4 + ((k + 8) % 8)*.12 }); continue; }
        else if (y === F + 2 || y === F + 11) t = 'polished_blackstone_bricks';
      }
      W.set(x, y, z, t);
    }
    if (r >= 5.5 && r < 8.5 && hash3(x, 9, z) > .18) W.set(x, F + 6, z, 'spruce_planks');
  }
  // the dome (group 1: it turns to the moon) and its shutter strip (group 2: it slides open)
  for (let x = -10; x <= 10; x++) for (let z = -10; z <= 10; z++) for (let y = D; y <= D + 10; y++) {
    const r3 = Math.hypot(x, y - D, z); if (r3 < 8.7 || r3 >= 9.75) continue;
    if (Math.abs(x) <= 1 && z >= 0) { W.set(x, y, z, 'oxidized_cut_copper', { g:2 }); continue; }
    W.set(x, y, z, Math.abs(Math.sin(Math.atan2(z, x)*6)) < .16 ? 'polished_blackstone' : hash3(x, y, z) > .3 ? 'oxidized_copper' : 'weathered_copper', { g:1 });
  }
  for (const e of [...W.M.values()]) if (e.g === 1 && e.x < -2 && e.y > D + 2 && Math.hypot(e.x + 6, e.y - D - 5, e.z + 2) < 4.6 + 2*(vnoise(e.x*.4, e.y*.4, e.z*.4) - .5)) {
    W.del(e.x, e.y, e.z); if (hash3(e.x, e.y, e.z) < .4) K.dropRubble(W, e.x + 3, F + 5, e.z, 'cobblestone'); }
  // the telescope: pillar and fork (static), the tube (group 3): copper, gold rings, our moon lens at the mouth
  W.box(-1, F, -1, 0, D - 1, 0, 'polished_blackstone');
  for (const x of [-2, 1]) for (let y = D - 1; y <= D; y++) W.set(x, y, 0, 'polished_blackstone_wall');
  const g3 = { g:3 };
  for (let z = -6; z <= 8; z++) for (let x = -1; x <= 0; x++) for (let y = D; y <= D + 1; y++) W.set(x, y, z, z === 8 ? 'crimson_eclipse:moon_lens' : z === -6 ? 'chiseled_copper' : 'cut_copper', { ...g3, d:8.6 });
  for (const z of [-5, 3, 7]) for (let x = -2; x <= 1; x++) for (let y = D - 1; y <= D + 2; y++) if (x < -1 || x > 0 || y < D || y > D + 1) W.set(x, y, z, 'gold_block', g3);
  // the armillary sphere on the terrace: our anchor block on a pedestal, its rings are groups 4, 5, 6
  W.set(A[0], F, A[2], 'chiseled_polished_blackstone'); W.set(A[0], F + 1, A[2], 'polished_blackstone_wall'); W.set(A[0], F + 2, A[2], 'polished_blackstone_wall');
  W.set(A[0], F + 3, A[2], 'gold_block'); W.set(A[0], F + 4, A[2], 'crimson_eclipse:armillary', { parts:{ ringA:4, ringB:5, ringC:6 }, d:4.6 });
  // library wing with a portico, mostly fallen in
  for (let x = 10; x <= 24; x++) for (let z = -7; z <= 7; z++) for (let y = F; y <= F + 11; y++) {
    const wall = x === 24 || z === -7 || z === 7 || x === 10;
    if (y === F + 5 && !wall) { W.set(x, y, z, 'spruce_planks'); continue; }
    if (y === F + 11) { W.set(x, y, z, 'polished_blackstone_bricks'); continue; }
    if (!wall) { if (y < F + 4 && (z === 6 || z === -6) && x > 11 && x < 23 && hash3(x, y, z) > .15) W.set(x, y, z, 'bookshelf'); continue; }
    if (x === 10 && Math.abs(z) <= 1 && y <= F + 3) continue;
    const win = (z === 7 || z === -7) && (x % 3 === 0) && x < 24 && ((y >= F + 2 && y <= F + 3) || (y >= F + 7 && y <= F + 9));
    W.set(x, y, z, win ? GLASS : 'deepslate_bricks', { d:5.3 + (x - 10)*.08 + (y > F + 5 ? .4 : 0) });
  }
  for (const x of [11, 14, 17, 20, 23]) { const fallen = x === 17 || x === 23;
    for (let y = F; y <= (fallen ? F + 1 : F + 8); y++) W.set(x, y, -10, 'quartz_pillar');
    if (fallen) for (let k = 2; k <= 6; k++) W.set(x - k, F, -12, 'quartz_pillar[axis=x]'); else W.set(x, F + 9, -10, 'polished_blackstone_bricks'); }
  for (let x = 10; x <= 21; x++) if (hash3(x, 3, 3) > .4) W.set(x, F + 9, -10, 'polished_blackstone_bricks');
  K.collapse(W, e => e.x > 15 && e.y > F + 4 + 4*vnoise(e.x*.3, 1, e.z*.3) - (e.x - 15)*.25 && e.x <= 24 && e.z >= -7 && e.z <= 7, RUBBLE);
  K.collapse(W, e => e.x > 9 && e.x < 25 && e.z === -10 && e.y > F + 8 && hash3(e.x, e.y, 1) > .5, RUBBLE);
  K.collapse(W, e => e.g === 0 && e.id !== 'polished_blackstone_bricks' && Math.hypot(e.x, e.z) >= 8.5 && Math.hypot(e.x, e.z) < 10.6 && e.x > 2 && e.z > 3 && e.y > F + 7 && vnoise(e.x*.35, e.y*.3, e.z*.35) > .45, RUBBLE);
  K.weather(W, { deepslate_bricks:(e, n, r) => r > .84 ? 'cracked_deepslate_bricks' : null, stone:(e, n) => n > .66 ? 'mossy_cobblestone' : null,
    polished_andesite:(e, n) => n > .7 ? 'andesite' : null });
  K.vines(W, e => e.id === 'deepslate_bricks' || e.id === 'stone' || e.id === 'polished_andesite', .022, 2);
  W.figure(4, 0, -27);
  return {
    tag:'A domed observatory on a rock above the plain, its library wing fallen in, a dead brass sphere on the terrace. <i>Under the blood moon:</i> the dome grinds round to face the moon, the shutters slide open, the great telescope lifts and fires a red beam into it; the sphere\'s rings start turning around a red core.',
    cam:{ target:[3, 12, 0], dist:82, yaw:Math.PI - .62, pitch:.2 },
    sun:norm([.35, .78, -.55]), moon,
    flat:(x, z) => Math.max(Math.hypot(x*(x > 0 ? .8 : 1), z) - 26, 0),
    shakeAt:3.3,
    groups(nt, t) {
      const g = [], k = ss(3.3, 6.8, nt), open = ss(5.2, 7.6, nt), tilt = ss(6.4, 9, nt);
      const Y = RY(az*k);
      g[1] = Y;
      g[2] = M4(Y, about([0, D, 0], M4(RX(-1.68*open), Sm(1 + .06*open))));
      g[3] = M4(Y, about(P, RX(-el*tilt)));
      const n = nt - 4.6, C = [A[0] + .5, A[1] + .5, A[2] + .5];
      g[4] = about(C, RX(.6 + spinUp(n, 1.5)*1.3)); g[5] = about(C, RY(.3 + spinUp(n, 1.5)*.9)); g[6] = about(C, M4(RZ(.41), RY(spinUp(n, 1.5)*-1.7), RX(.2 + spinUp(n, 1.5)*.5)));

    },
    beams(nt, t, G) { const p = applyP(G[3], [0, P[1], 9]), d = applyD(G[3], [0, 0, 1]);
      return [{ a:p, b:[p[0] + d[0]*260, p[1] + d[1]*260, p[2] + d[2]*260], w:.75, e:ss(8.6, 10, nt) }]; },
    lights(W) {
      W.light([0, D + 1, 9.5], [6, .6, .4], 14, 8.6, 3);
      W.light([0, D + 6, 0], [2.4, .25, .18], 9, 6);
      for (let i = 0; i < 160; i++) W.part(-7 + hash3(i,1,3)*14, F + 1 + hash3(i,2,3)*16, -7 + hash3(i,3,3)*14, 0, hash3(i,4,3), .07, 0, 0, 1,1,1);
      for (let i = 0; i < 90; i++) { const a = hash3(i,5,3)*6.283, r = 1 + hash3(i,6,3)*2;
        W.part(A[0] + .5 + Math.cos(a)*r, F + 2.5, A[2] + .5 + Math.sin(a)*r, 1, hash3(i,7,3), .1, 4.8, 5 + hash3(i,8,3)*4, 4, .55, .3); }

}

// ================================================================ C · the manor
function manor(W) {
  const yb3 = [2, 7, 12], BRICK = 'bricks', WHITE = 'calcite', FLOOR = 'dark_oak_planks', PANE = 'glass_pane';
  const candleAt = [];
  for (let x = -15; x <= 15; x++) for (let z = -7; z <= 7; z++) W.set(x, 0, z, FLOOR);
  // main block: walls, bands, quoins, floors (and an attic floor)
  for (let x = -15; x <= 15; x++) for (let z = -7; z <= 7; z++) for (let y = 1; y <= 15; y++) {
    const edge = x === -15 || x === 15 || z === -7 || z === 7;
    if (!edge) { if (y === 5 || y === 10 || y === 15) W.set(x, y, z, FLOOR); continue; }
    const corner = Math.abs(x) >= 14 && Math.abs(z) >= 6;
    W.set(x, y, z, (y === 5 || y === 10 || y === 15) ? WHITE : corner && (y % 2 === 0) ? WHITE : BRICK);
  }
  // windows: glass panes; behind each one a candle that lights under the blood moon, one room after the other
  const wins = [];
  for (const yb of yb3) {
    for (const x of [12, 9, 6, -7, -10, -13]) wins.push([x, yb, 7, 'z']);
    for (const z of [2, -4]) wins.push([-15, yb, z, 'x']);
    for (const x of [-13, -10, -7, 6, 9, 12]) wins.push([x, yb, -7, 'z']);
    for (const z of [-4, 2]) wins.push([15, yb, z, 'x']);
  }
  wins.forEach(([a, yb, b, ax], i) => { const d = 3.6 + i*.21 + hash3(i, 2, 2)*.3, broken = hash3(i, 7, 7) < .28;
    for (let k = 0; k <= 1; k++) for (let y = yb; y <= yb + 2; y++) {
      const x = ax === 'z' ? a + k : a, z = ax === 'z' ? b : b + k; if (broken) W.del(x, y, z); else W.set(x, y, z, PANE); }
    for (let k = -1; k <= 2; k++) { const x = ax === 'z' ? a + k : a, z = ax === 'z' ? b : b + k; W.set(x, yb - 1, z, WHITE); W.set(x, yb + 3, z, WHITE); }
    candleAt.push([ax === 'z' ? a : a - Math.sign(a), yb - 1, ax === 'z' ? b - Math.sign(b) : b, d]); });
  // central tower: portico, balcony with iron railing, the clock (our anchor: its hands turn backwards at night)
  for (let x = -2; x <= 2; x++) for (let z = 6; z <= 10; z++) for (let y = 1; y <= 24; y++) {
    const edge = x === -2 || x === 2 || z === 6 || z === 10;
    if (!edge) { if (y === 5 || y === 10 || y === 15) W.set(x, y, z, FLOOR); else W.del(x, y, z); continue; }
    if (z === 7 && y <= 15) { W.del(x, y, z); continue; }
    W.set(x, y, z, (Math.abs(x) === 2 && (z === 6 || z === 10) && y % 2 === 0) || y === 15 || y === 24 ? WHITE : BRICK);
  }
  for (let x = -1; x <= 1; x++) for (let y = 1; y <= 3; y++) W.del(x, y, 10); W.del(0, 4, 10);
  for (const [x, y] of [[-2,1], [-2,2], [-2,3], [2,1], [2,2], [2,3], [-1,4], [1,4], [0,5]]) W.set(x, y, 10, WHITE);
  for (const yb of [7, 12, 17]) { for (let y = yb; y <= yb + 1; y++) W.set(0, y, 10, PANE); candleAt.push([0, yb - 1, 9, 4.4 + yb*.08]); }
  for (const s of [-3, 3]) for (let y = 1; y <= 5; y++) W.set(s, y, 12, 'quartz_pillar');
  W.box(-3, 6, 11, 3, 6, 12, 'smooth_quartz');
  for (let x = -3; x <= 3; x++) W.set(x, 7, 12, 'iron_bars'); W.set(-3, 7, 11, 'iron_bars'); W.set(3, 7, 11, 'iron_bars');
  for (let x = -2; x <= 2; x++) for (let y = 19; y <= 23; y++) if (Math.abs(x) === 2 || y === 19 || y === 23) W.set(x, y, 10, 'polished_blackstone_bricks'); else W.set(x, y, 10, WHITE);
  W.set(0, 21, 10, 'crimson_eclipse:vigil_clock[facing=south]', { parts:{ minute:1, hour:2 } });
  K.pyramid(W, 0, 8, 25, [2, 2, 1, 1, 0, 0, 0, 0, 0], 'deepslate_tiles', 'deepslate_tile_stairs');
  W.set(0, 34, 8, 'iron_chain');
  // mansard roof (stairs on each step), dormers, chimneys
  const ins = [0, 0, 1, 1, 2, 4, 6, 99];
  for (let y = 16; y <= 22; y++) for (let x = -15; x <= 15; x++) for (let z = -7; z <= 7; z++) {
    if (x >= -2 && x <= 2 && z >= 6) continue;
    const d = Math.min(x + 15, 15 - x, z + 7, 7 - z), i = y - 16;
    if (!(d >= ins[i] && (y === 22 || d < ins[i+1] + 1))) continue;
    if (d === ins[i] && y < 22 && ins[i+1] > ins[i]) { const f = d === x + 15 ? 'east' : d === 15 - x ? 'west' : d === z + 7 ? 'south' : 'north';
      W.set(x, y, z, `deepslate_tile_stairs[facing=${f}]`); }
    else W.set(x, y, z, 'deepslate_tiles'); }
  for (const x of [-11, -6, 5, 10]) for (const z of [7, -7]) { const s = Math.sign(z);
    for (let y = 16; y <= 18; y++) for (let k = 0; k <= 1; k++) W.set(x + k, y, z, y <= 17 ? PANE : BRICK);
    for (let k = -1; k <= 2; k++) { W.set(x + k, 19, z, 'deepslate_tile_slab'); W.set(x + k, 19, z - s, 'deepslate_tile_slab'); }
    for (let k = 0; k <= 1; k++) W.del(x + k, 16, z - s);

  for (const [x, z, top] of [[11,-4,26], [11,3,25], [-12,-4,25], [-12,3,21]]) { W.box(x, 16, z, x + 1, top, z + 1, BRICK); if (top > 22) W.box(x, top + 1, z, x + 1, top + 1, z + 1, 'polished_blackstone_bricks'); }
  // side wings: the right one overgrown, the left one burnt out
  for (const s of [1, -1]) for (let ax = 16; ax <= 26; ax++) for (let z = -5; z <= 4; z++) {
    const x = s*ax, edge = ax === 26 || z === -5 || z === 4;
    W.set(x, 0, z, FLOOR);

    if (e.id === FLOOR) e.id = hash3(e.x, e.y, e.z) > .4 ? 'coal_block' : 'stripped_dark_oak_log'; }
  K.collapse(W, e => e.x <= -16 && (isRoof(e) || (e.y > 6 && vnoise(e.x*.3 + 4, e.y*.25, e.z*.3) > .42) || (e.y === 5 && hash3(e.x, 5, e.z) > .5)), 'blackstone');
  for (const z of [-3, 0, 3]) for (let x = -26; x <= -17; x++) if (!W.get(x, 10, z) && hash3(x, z, 1) > .15) W.set(x, 10, z, 'stripped_dark_oak_log[axis=x]');
  // collapsed back corner of the main block
  K.collapse(W, e => e.x >= 7 && e.x <= 15 && e.z <= 2 && e.y >= 7 && vnoise(e.x*.28, e.y*.28, e.z*.28) > .32 - (e.x - 7)*.035, RUBBLE);
  // the candles, only where a floor is left under them
  for (const [x, y, z, d] of candleAt) if (!W.get(x, y, z) && W.get(x, y - 1, z) && CE.blocks.fullSolid(W.get(x, y - 1, z)))
    W.set(x, y, z, `candle[candles=${2 + Math.floor(hash3(x, y, z)*3)},lit=false]`, { awake:{ lit:true }, d });
  K.vines(W, e => e.id === BRICK || e.id === WHITE, .03, 3);
  return { yb3 };
}
function manorGrounds(W) {     // after the terrain: gravel path, the fountain, fence and gate, hedges, dead trees
  for (let z = 11; z <= 36; z++) for (let x = -1; x <= 1; x++) { const r = Math.hypot(x, z - 22); if (r > 4.5 && hash3(x, z, 6) > .08) W.set(x, -1, z, hash3(x, z, 7) > .3 ? 'gravel' : 'coarse_dirt'); }
  for (let x = -7; x <= 7; x++) for (let z = 15; z <= 29; z++) { const r = Math.hypot(x, z - 22);
    if (r >= 4.5 && r < 6.2 && hash3(x, z, 6) > .1) W.set(x, -1, z, 'gravel');
    if (r >= 3 && r < 4) W.set(x, 0, z, 'calcite');
    else if (r < 3) { W.set(x, -1, z, 'calcite'); W.set(x, 0, z, 'water', { awake:'crimson_eclipse:blood_water', d:4 }); } }
  W.set(0, 0, 22, 'quartz_pillar'); W.set(0, 1, 22, 'quartz_pillar'); W.box(-1, 2, 21, 1, 2, 23, 'smooth_quartz');
  for (let x = -1; x <= 1; x++) for (let z = 21; z <= 23; z++) W.set(x, 3, z, x || z !== 22 ? 'smooth_quartz_slab' : 'water', x || z !== 22 ? {} : { awake:'crimson_eclipse:blood_water', d:4.1 });
  for (let x = -24; x <= 23; x++) { if (x >= -2 && x <= 1) continue;
    if (x === -3 || x === 2) { for (let y = 0; y <= 2; y++) W.set(x, y, 36, 'calcite'); W.set(x, 3, 36, 'candle[candles=4,lit=false]', { awake:{ lit:true }, d:x < 0 ? 3.2 : 3.25 }); continue; }
    if (x % 4 === 0) { W.set(x, 0, 36, 'polished_blackstone_brick_wall'); W.set(x, 1, 36, 'polished_blackstone_brick_wall'); }
    else if (hash3(x, 36, 1) > .12) { W.set(x, 0, 36, 'iron_bars'); W.set(x, 1, 36, 'iron_bars'); } }
  for (let x = -2; x <= 1; x++) for (let y = 0; y <= 1; y++) W.set(x, y, 36, 'iron_bars', { g:x < 0 ? 3 : 4 });     // the gate's two leaves
  for (const s of [-3, 3]) for (let z = 13; z <= 33; z++) { if (z > 16 && z < 28) continue; for (let y = 0; y <= 1; y++) if (hash3(s, y, z) > .25) W.set(s, y, z, 'azalea_leaves'); }
  K.deadTree(W, -12, 25, 9, 7); K.deadTree(W, 13, 30, 8, 11); K.deadTree(W, -22, 14, 7, 13);
  W.figure(2, 0, 31);
}
function manorMeta() {
  return {
    tag:'A three-storey brick manor with a clock tower, one wing burnt out, a corner fallen in, a dry fountain in an overgrown courtyard. <i>Under the blood moon:</i> the gate swings open, the candles on the gate piers catch, then a candle behind each window, room after room, as if someone walks the house; the fountain runs red and the clock turns backwards.',
    cam:{ target:[0, 10, 6], dist:88, yaw:.45, pitch:.2 },
    sun:norm([.45, .76, .55]), moon:dirFrom(.45 + Math.PI + .4, .24),
    flat:(x, z) => Math.max(Math.abs(x) - 32, Math.abs(z - 12) - 30, 0),
    shakeAt:null,
    groups(nt, t) {
      const g = [], C = [.5, 21.5, 11.1], n = Math.max(0, nt - 5.5);
      g[1] = about(C, RZ(.35 + spinUp(n, 1)*2.4)); g[2] = about(C, RZ(1.1 + spinUp(n, 1)*.2));
      const k = ss(3.2, 7.5, nt), a = k*1.35 + (1 - k)*.03*Math.sin(t*.8);

    lights(W) {
      for (let i = 0; i < 140; i++) W.part(-18 + hash3(i,1,4)*36, .5 + hash3(i,2,4)*9, 10 + hash3(i,3,4)*26, 0, hash3(i,4,4), .07, 0, 0, 1,1,1);
      for (let i = 0; i < 130; i++) W.part(.5, 3.6, 22.5, 2, hash3(i,5,4), .07, 4.3, 0, 3, .15, .12);
      for (let i = 0; i < 110; i++) W.part(-26 + hash3(i,6,4)*10, 1, -5 + hash3(i,7,4)*9, 1, hash3(i,8,4), .09, 1, 6 + hash3(i,9,4)*6, 4, .8, .3);
    },
    trees:[[-44,-18,12], [-36,-34,14], [36,-30,13], [46,-8,11], [-50,10,12], [24,-46,13], [-10,-46,12]],

}

// ================================================================ the page
function variant(key, short, name, build) {
  return { key, short, name, make(W) {
    let meta = build(W);
    if (build === manor) meta = manorMeta();
    meta.size = K.sizeOf(W);
    K.terrain(W, meta.flat);
    if (build === manor) manorGrounds(W);
    for (const [x, z, h] of meta.trees) K.spruce(W, x, z, h);
    meta.lights(W);
    meta.dayLabel = 'Day: a ruin';
    return meta;
  } };
}
CE.viewer({ dayLabel:'Day: a ruin', variants:[
  variant('A', 'Chapel', 'Chapel of the Eclipse', chapel),
  variant('B', 'Observatory', 'Moonwatch Observatory', observatory),
  variant('C', 'Manor', 'Vigil Manor', manor),
] });
