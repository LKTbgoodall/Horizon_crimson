<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abandoned Building</title>
<!--
  Preview of the first structure (vault/04 - Design/Structures.md): a big abandoned building, three candidates.
  Each one is shown by day (a ruin) and under the blood moon (it wakes up). Real blocks: instanced cubes with
  16x16 pixel faces, plus free boxes for the moving parts (the future anchor blocks' models). HDR + bloom.
  Self-contained, no dependency.
  URL parameters: ?v=a|b|c  &night=1  &ui=0  &spin=0
-->
<style>
  :root { --red:#ff3b2f; --dim:#b9a7a5; --bg:rgba(12,4,5,.72); --line:rgba(255,90,70,.22); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:#f3e9e7; overflow:hidden;
    font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas.drag { cursor:grabbing; }
  .ui { transition:opacity .35s; }
  body.hide .ui { opacity:0; pointer-events:none; }
  #cap { position:fixed; left:18px; top:14px; max-width:min(620px,74vw); text-shadow:0 1px 6px #000,0 0 2px #000; pointer-events:none; }
  #cap .v { font-size:22px; font-weight:700; letter-spacing:.02em; }
  #cap .v b { color:var(--red); margin-right:.35em; }
  #cap .tag { color:#e6d6d3; margin-top:4px; }
  #cap .tag i { color:var(--dim); font-style:normal; }
  #cap .size { color:var(--dim); margin-top:6px; font-size:12px; }
  #cap .ph { margin-top:8px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#ffb4a8; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:10px 16px 12px; background:linear-gradient(transparent,rgba(0,0,0,.82) 45%);
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; }
  .grp { display:flex; gap:6px; flex-wrap:wrap; }
  button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:6px 11px; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--red); }
  button.on { background:#7d120d; border-color:var(--red); }
  #hint { color:var(--dim); font-size:12px; margin-left:auto; }
  #err { position:fixed; inset:0; display:none; place-items:center; padding:30px; text-align:center; color:#ffb4a8; white-space:pre-wrap; font:12px monospace; overflow:auto; }
  @media (max-width:640px){ #cap .tag { font-size:12px; } #hint { display:none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="cap" class="ui"><div class="v"><b id="vk"></b><span id="vn"></span></div><div class="tag" id="vt"></div><div class="size" id="vs"></div><div class="ph" id="ph"></div></div>
<div id="bar" class="ui">
  <div class="grp" id="vars"></div>
  <div class="grp"><button id="bDay">☀ Day</button><button id="bNight">☾ Blood moon</button></div>
  <div class="grp"><button id="bSpin">⟳ Turn</button><button id="bUi">Hide UI (H)</button></div>
  <span id="hint">drag to turn · wheel to zoom · 1 2 3 · N night · D day</span>
</div>
<div id="err"></div>
<script>
'use strict';
// ---------------------------------------------------------------- helpers
const ss = (a, b, x) => { x = Math.min(1, Math.max(0, (x-a)/(b-a))); return x*x*(3-2*x); };
function hash3(x, y, z) { let h = (Math.imul(x|0,374761393) + Math.imul(y|0,668265263) + Math.imul(z|0,1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, z) { const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const s = t => t*t*(3-2*t), u = s(x-xi), v = s(y-yi), w = s(z-zi), h = (a,b,c) => hash3(xi+a, yi+b, zi+c), l = (a,b,t) => a+(b-a)*t;
  return l(l(l(h(0,0,0),h(1,0,0),u), l(h(0,1,0),h(1,1,0),u), v), l(l(h(0,0,1),h(1,0,1),u), l(h(0,1,1),h(1,1,1),u), v), w); }
const norm = a => { const l = Math.hypot(...a) || 1; return a.map(x => x/l); };
const dirFrom = (az, el) => [Math.sin(az)*Math.cos(el), Math.sin(el), Math.cos(az)*Math.cos(el)];

// matrices, column-major
const I4 = () => { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; };
const Tm = (x,y,z) => { const m = I4(); m[12] = x; m[13] = y; m[14] = z; return m; };
const Sm = s => { const m = I4(); m[0] = m[5] = m[10] = s; return m; };
const RX = a => { const c = Math.cos(a), s = Math.sin(a), m = I4(); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; };
const RY = a => { const c = Math.cos(a), s = Math.sin(a), m = I4(); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; };
const RZ = a => { const c = Math.cos(a), s = Math.sin(a), m = I4(); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; };
function mul(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k*4+j]*b[i*4+k]; o[i*4+j] = s; } return o; }
const M4 = (...ms) => ms.reduce((a, b) => mul(a, b));
const about = (p, m) => M4(Tm(p[0],p[1],p[2]), m, Tm(-p[0],-p[1],-p[2]));
const applyP = (m, p) => [m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12], m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13], m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];
const applyD = (m, p) => [m[0]*p[0]+m[4]*p[1]+m[8]*p[2], m[1]*p[0]+m[5]*p[1]+m[9]*p[2], m[2]*p[0]+m[6]*p[1]+m[10]*p[2]];
// eased ramp then linear: integral of a smooth speed-up, so spins start gently
const spinUp = (n, ramp) => n <= 0 ? 0 : n < ramp ? n*n/(2*ramp) : n - ramp/2;

// ---------------------------------------------------------------- block types (same numbers in the shader)
const T = { GRASS:0, DIRT:1, PALE:2, PALEMOSS:3, DEEP:4, SLATE:5, PLANK:6, LOG:7, DGLASS:8, RGLASS:9, LEAF:10, RUBBLE:11, BLACK:12,
  COPPER:13, CANDLE:14, GOLD:15, WOOL:16, BRICK:17, WHITE:18, WATER:19, EYE:20, IRON:21, STONE:22, LENS:23, RUNE:24, FIGURE:25,
  CRYSTAL:26, SHUTTER:27, BOOKS:28, PINE:29, PALECRACK:30, DEEPCRACK:31, BRICKMOSS:32, CHAR:33 };
const CLEAR = new Set([T.DGLASS, T.RGLASS, T.LEAF, T.PINE, T.WATER, T.EYE]);

// ---------------------------------------------------------------- the world being built
function World() {
  const M = new Map(), F = [], LIGHTS = [], PARTS = [];
  const K = (x,y,z) => (x+1000)*4e6 + (y+1000)*2000 + (z+1000);
  return { M, F, LIGHTS, PARTS,
    set(x,y,z,t,g=0,d=0) { M.set(K(x,y,z), {x,y,z,t,g,d}); },
    get(x,y,z) { return M.get(K(x,y,z)); },
    del(x,y,z) { M.delete(K(x,y,z)); },
    box(x0,y0,z0,x1,y1,z1,t,g=0,d=0) { for (let x = Math.min(x0,x1); x <= Math.max(x0,x1); x++) for (let y = Math.min(y0,y1); y <= Math.max(y0,y1); y++)
      for (let z = Math.min(z0,z1); z <= Math.max(z0,z1); z++) this.set(x,y,z,t,g,d); },
    fb(x,y,z,sx,sy,sz,t,g=0,d=0) { F.push({x,y,z,sx,sy,sz,t,g,d}); },
    light(p,c,rad,d,grp=0) { LIGHTS.push({p,c,rad,d,grp}); },
    part(x,y,z,kind,ph,size,d,ex,r,g,b) { PARTS.push(x,y,z,kind, ph,size,d,ex, r,g,b); },
  };
}
function dropRubble(W, x, y, z, t) { let yy = y; while (yy > -1 && !W.get(x, yy-1, z)) yy--; if (!W.get(x, yy, z)) W.set(x, yy, z, t); }
// remove what `test` picks (static blocks only); some of it falls as rubble below
function collapse(W, test, rubble = T.RUBBLE, chance = .35) {
  const gone = []; for (const e of W.M.values()) if (e.g === 0 && test(e)) gone.push(e);
  for (const e of gone) W.del(e.x, e.y, e.z);
  for (const e of gone) if (e.y > 2 && hash3(e.x+11, e.y, e.z) < chance)
    dropRubble(W, e.x + Math.round((hash3(e.x, e.y+5, e.z)-.5)*3), e.y, e.z + Math.round((hash3(e.x, e.y, e.z+5)-.5)*3), typeof rubble === 'function' ? rubble(e) : rubble);
}
function weather(W) { for (const e of W.M.values()) { if (e.g) continue;
  const n = vnoise(e.x*.21+3, e.y*.21, e.z*.21), r = hash3(e.x, e.y, e.z);
  if (e.t === T.PALE) { if (n > .72 - (e.y < 4 ? .2 : 0)) e.t = T.PALEMOSS; else if (r > .88) e.t = T.PALECRACK; }
  else if (e.t === T.DEEP) { if (r > .84) e.t = T.DEEPCRACK; }
  else if (e.t === T.BRICK) { if (n > .64 - (e.y < 4 ? .2 : 0)) e.t = T.BRICKMOSS; } } }
function vines(W, types, chance, seed) { const D = [[1,0],[-1,0],[0,1],[0,-1]];
  for (const e of [...W.M.values()]) { if (!types.has(e.t) || e.y < 3 || e.g || hash3(e.x*3+seed, e.y, e.z) > chance) continue;
    for (const [dx, dz] of D) { if (W.get(e.x+dx, e.y, e.z+dz)) continue;
      const len = 3 + Math.floor(hash3(e.x, e.y*7, e.z)*9), th = .06;
      for (let k = 0; k < len; k++) { const y = e.y - k; if (y < 0 || !W.get(e.x, y, e.z) || W.get(e.x+dx, y, e.z+dz)) break;
        W.fb(dx > 0 ? e.x+1 : dx < 0 ? e.x-th : e.x, y, dz > 0 ? e.z+1 : dz < 0 ? e.z-th : e.z, dx ? th : 1, 1, dz ? th : 1, T.LEAF); }
      break; } } }
function terrain(W, flat, R = 76) {
  const hgt = (x, z) => { const v = 1.3*Math.sin(x*.09+z*.05) + .9*Math.sin(z*.13-x*.07+2) + .5*Math.sin(x*.31+z*.23);
    return Math.round(Math.max(-.6, v+.7) * ss(0, 16, flat(x, z))); };
  for (let x = -R; x < R; x++) for (let z = -R; z < R; z++) {
    const h = hgt(x, z); let lo = h;
    for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) lo = Math.min(lo, hgt(x+dx, z+dz));
    for (let y = h-1; y >= Math.min(lo-1, h-1); y--) if (!W.get(x, y, z)) W.set(x, y, z, y === h-1 ? T.GRASS : T.DIRT);
  }
  const g = (x,z,sx,sz) => W.fb(x, -2, z, sx, 1.02, sz, T.GRASS);
  g(-400, -400, 800, 400-R); g(-400, R, 800, 400-R); g(-400, -R, 400-R, 2*R); g(R, -R, 400-R, 2*R);
}
function pine(W, x, z, h) { const y0 = W.get(x, 0, z) ? 1 : 0;
  for (let y = 0; y < h; y++) W.set(x, y0+y, z, T.LOG);
  for (let y = 3; y <= h+1; y++) { const r = Math.max(0, Math.round((h+1-y)*.42)); for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++)
    if ((dx || dz || y > h-1) && Math.abs(dx)+Math.abs(dz) <= r+ (y%2) && hash3(x+dx, y, z+dz) > .12 && !W.get(x+dx, y0+y, z+dz)) W.set(x+dx, y0+y, z+dz, T.PINE); } }
function deadTree(W, x, z, h, seed) { for (let y = 0; y < h; y++) W.set(x, y, z, T.LOG);
  const arms = [[1,0],[-1,0],[0,1],[0,-1],[1,1],[-1,-1]];
  for (let i = 0; i < 4; i++) { const [dx, dz] = arms[Math.floor(hash3(seed, i, 3)*arms.length)]; let px = x, pz = z, py = h-4+i;
    for (let k = 0; k < 3+Math.floor(hash3(seed, i, 9)*3); k++) { px += dx; pz += dz; if (k % 2) py++; W.set(px, py, pz, T.LOG); } } }
function figure(W, x, y, z) { W.fb(x-.3, y, z-.15, .6, .75, .3, T.FIGURE); W.fb(x-.3, y+.75, z-.15, .6, .72, .3, T.FIGURE);
  W.fb(x-.42, y+.8, z-.12, .12, .65, .24, T.FIGURE); W.fb(x+.3, y+.8, z-.12, .12, .65, .24, T.FIGURE); W.fb(x-.25, y+1.47, z-.25, .5, .5, .5, T.FIGURE); }

// ---------------------------------------------------------------- candidate A: the chapel
function buildChapel(W) {
  const yr = x => 15 + Math.round((7 - Math.abs(x))*1.6);
  for (let x = -7; x <= 7; x++) for (let z = -26; z <= 16; z++) W.set(x, 0, z, ((x+z) & 1) ? T.BLACK : T.PALE);
  // nave walls, windows, buttresses
  for (let z = -18; z <= 14; z++) for (let y = 1; y <= 14; y++) { W.set(-7, y, z, T.PALE); W.set(7, y, z, T.PALE); }
  for (const zc of [-14, -8, -2, 4, 10]) for (const sx of [-7, 7]) {
    const d = 3.8 + (zc+14)*.055 + (sx > 0 ? .08 : 0);
    for (let dz = -1; dz <= 1; dz++) { for (let y = 3; y <= 10; y++) W.set(sx, y, zc+dz, T.RGLASS, 0, d); W.set(sx, 2, zc+dz, T.BLACK); }
    W.set(sx, 11, zc, T.RGLASS, 0, d); W.set(sx, 11, zc-1, T.WHITE); W.set(sx, 11, zc+1, T.WHITE); W.set(sx, 12, zc, T.WHITE);
  }
  for (const zp of [-17, -11, -5, 1, 7, 13]) for (const s of [-1, 1]) {
    for (let y = 1; y <= 12; y++) W.set(s*8, y, zp, T.PALE);
    for (let y = 1; y <= 8; y++) W.set(s*9, y, zp, T.PALE);
    for (let y = 1; y <= 4; y++) W.set(s*10, y, zp, T.PALE);
    W.set(s*8, 13, zp, T.WHITE); W.set(s*9, 9, zp, T.WHITE); W.set(s*10, 5, zp, T.WHITE);
    if (hash3(zp, s, 1) > .3) W.fb(s*8 + .3, 14, zp + .3, .4, 1.8, .4, T.SLATE);
  }
  // steep stepped roof, ridge cresting, back gable
  for (let z = -18; z <= 14; z++) for (let x = -7; x <= 7; x++) {
    const a = yr(x), b = x ? yr(Math.abs(x)-1) : a+1; for (let y = a; y < Math.max(b, a+1); y++) W.set(x, y, z, T.SLATE);
    if (x === 0 && (z & 1)) W.set(0, a+1, z, T.BLACK);
  }
  for (let x = -7; x <= 7; x++) for (let y = 14; y < yr(x); y++) W.set(x, y, -19, T.PALE);
  // facade: gable, pilasters, door, rose window
  for (let x = -7; x <= 7; x++) for (let y = 1; y <= yr(x); y++) { W.set(x, y, 15, T.PALE); W.set(x, y, 16, T.PALE); }
  for (const s of [-1, 1]) { for (let y = 1; y <= 19; y++) { W.set(s*8, y, 15, T.PALE); W.set(s*8, y, 16, T.PALE); } W.set(s*8, 20, 16, T.BLACK); W.fb(s*8+.3, 21, 16.3, .4, 2.2, .4, T.BLACK); }
  const door = (x, y) => (Math.abs(x) <= 2 && y >= 1 && y <= 6) || (Math.abs(x) <= 1 && y === 7) || (x === 0 && y === 8);
  for (let x = -3; x <= 3; x++) for (let y = 1; y <= 9; y++) {
    if (door(x, y)) { W.del(x, y, 15); W.del(x, y, 16); }
    else if (door(x + Math.sign(x), y) || door(x, y-1)) W.set(x, y, 16, T.BLACK);
  }
  for (let x = -6; x <= 6; x++) for (let y = 9; y <= 21; y++) { const r = Math.hypot(x, y-15); if (r > 5.3) continue;
    for (const z of [15, 16]) { const a = Math.atan2(y-15, x);
      if (r > 4.4) W.set(x, y, z, T.BLACK);
      else if (r < 1.7) W.set(x, y, z, T.EYE, 0, 4.3);
      else if (Math.abs(Math.sin(a*4)) < .24) W.set(x, y, z, T.BLACK);
      else W.set(x, y, z, T.RGLASS, 0, 4.15); } }
  W.fb(-2, 0.99, 17.4, 2.6, .3, 5.6, T.PLANK);                 // the left door leaf, fallen
  W.fb(.3, 1, 14.6, 2.4, 6.2, .3, T.PLANK);                    // the right one, hanging ajar
  // bell tower (front left)
  for (let y = 0; y <= 30; y++) for (let x = -13; x <= -9; x++) for (let z = 14; z <= 18; z++) {
    const edge = x === -13 || x === -9 || z === 14 || z === 18; if (!edge && y > 0) continue;
    const mid = (x > -13 && x < -9) || (z > 14 && z < 18), corner = !mid;
    if (y >= 21 && y <= 26 && !corner) continue;               // belfry openings
    if (((y >= 8 && y <= 10) || (y >= 15 && y <= 17)) && ((x === -11 && (z === 14 || z === 18)) || (z === 16 && (x === -13 || x === -9)))) { W.set(x, y, z, T.DGLASS, 0, 9); continue; }
    W.set(x, y, z, y === 20 || y === 30 ? T.BLACK : T.PALE);
  }
  for (const [x, z] of [[-13,14],[-9,14],[-13,18],[-9,18]]) { W.set(x, 31, z, T.BLACK); W.fb(x+.3, 32, z+.3, .4, 1.8, .4, T.BLACK); }
  for (let k = 0; k < 10; k++) { const h = k < 3 ? 2 : k < 6 ? 1 : 0;
    for (let dx = -h; dx <= h; dx++) for (let dz = -h; dz <= h; dz++) if (Math.max(Math.abs(dx), Math.abs(dz)) === h) W.set(-11+dx, 31+k, 16+dz, T.SLATE); }
  W.fb(-11.6, 25.4, 15.2, .15, .3, 1.6, T.LOG); W.fb(-10.45, 25.4, 15.2, .15, .3, 1.6, T.LOG);
  // the bell (group 1), hung on a yoke along z, swings about the z axis
  const bell = (x,y,z,sx,sy,sz,t) => W.fb(x,y,z,sx,sy,sz,t,1,0);
  bell(-11.2, 25.4, 15.1, .4, .4, 1.8, T.LOG);
  bell(-11.45, 24.85, 15.95, .9, .55, .9, T.GOLD); bell(-11.65, 23.75, 15.75, 1.3, 1.1, 1.3, T.GOLD); bell(-11.85, 23.45, 15.55, 1.7, .32, 1.7, T.GOLD);
  bell(-11.1, 23.0, 16.4, .2, .7, .2, T.IRON); bell(-11.18, 22.75, 16.32, .36, .3, .36, T.IRON);
  // apse with tall slits and a half dome
  for (let x = -8; x <= 8; x++) for (let z = -27; z <= -19; z++) { const r = Math.hypot(x+.5-.5, z+18.5), a = Math.atan2(z+18.5, x);
    if (r >= 6.5 && r < 7.6) for (let y = 1; y <= 13; y++) {
      const slit = y >= 4 && y <= 10 && [-Math.PI/2, -Math.PI/4, -3*Math.PI/4].some(s => Math.abs(a - s) < .12);
      W.set(x, y, z, slit ? T.RGLASS : T.PALE, 0, 3.7); }
    for (let y = 14; y <= 21; y++) { const rr = 7.1*Math.sqrt(Math.max(0, 1 - ((y-14)/7.6)**2)); if (r >= rr-1.25 && r < rr) W.set(x, y, z, T.SLATE); } }
  // altar, candles, banner, chest
  W.box(-2, 1, -23, 2, 1, -22, T.WHITE); W.fb(-2.15, 2, -23.15, 5.3, .15, 2.3, T.BLACK);
  for (let i = 0; i < 7; i++) W.fb(-1.85 + i*.6, 2.15, -22.4 - (i % 2)*.4, .18, .35 + (i % 3)*.15, .18, T.CANDLE, 0, 3.6 + i*.05);
  W.fb(-1, 3.5, -25.35, 2, 6, .12, T.WOOL); W.fb(-1.3, 9.4, -25.4, 2.6, .25, .25, T.GOLD);
  W.fb(-.45, 1, -20.6, .9, .75, .7, T.PLANK); W.fb(-.48, 1.55, -20.64, .96, .25, .78, T.PLANK); W.fb(-.1, 1.45, -19.9, .2, .25, .05, T.GOLD);
  // pews, carpet, banners
  for (let z = -15; z <= 10; z += 2.6) for (const s of [-1, 1]) { const r = hash3(Math.round(z*10), s, 5), x0 = s < 0 ? -6 : 2;
    if (r < .2) continue;
    if (r < .38) { W.fb(x0, 1, z, 4, .15, 1.1, T.PLANK); continue; }
    W.fb(x0, 1.45, z, 4, .15, .6, T.PLANK); W.fb(x0, 1.45, z+.6, 4, .9, .12, T.PLANK);

  gl.uniform4fv(u.uLP, LP); gl.uniform4fv(u.uLC, LC); gl.uniform1i(u.uNL, Math.min(8, L.length));
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 36, NI);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthMask(false);
  gl.useProgram(P_PART.p); gl.bindVertexArray(vaoP);
  gl.uniformMatrix4fv(P_PART.u.uVP, false, VP); gl.uniform3fv(P_PART.u.uR, R); gl.uniform3fv(P_PART.u.uU, U);
  gl.uniform1f(P_PART.u.uTime, time); gl.uniform1f(P_PART.u.uAT, nt); gl.uniform1f(P_PART.u.uN, uN);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, NP);
  if (beams.length) {
    gl.useProgram(P_BEAM.p); gl.bindVertexArray(vaoQ);
    const BA = new Float32Array(6), BB = new Float32Array(6), BWd = new Float32Array(2), BE = new Float32Array(2);
    beams.slice(0, 2).forEach((b, i) => { BA.set(b.a, i*3); BB.set(b.b, i*3); BWd[i] = b.w; BE[i] = b.e*uN; });
    gl.uniformMatrix4fv(P_BEAM.u.uVP, false, VP); gl.uniform3fv(P_BEAM.u.uCam, eye); gl.uniform1f(P_BEAM.u.uTime, time);
    gl.uniform3fv(P_BEAM.u.uBA, BA); gl.uniform3fv(P_BEAM.u.uBB, BB); gl.uniform1fv(P_BEAM.u.uBW, BWd); gl.uniform1fv(P_BEAM.u.uBE, BE);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, Math.min(2, beams.length));
  }
  gl.depthMask(true); gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
  // bloom
  gl.bindVertexArray(vaoE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbA); gl.viewport(0, 0, BW, BH);
  gl.useProgram(P_BRIGHT.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texS);
  gl.uniform1i(P_BRIGHT.u.uS, 0); gl.uniform2f(P_BRIGHT.u.uPx, 1/W, 1/H); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.useProgram(P_BLUR.p); gl.uniform1i(P_BLUR.u.uS, 0);
  for (let k = 0; k < 2; k++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbB); gl.bindTexture(gl.TEXTURE_2D, texA); gl.uniform2f(P_BLUR.u.uDir, (1.5+k)/BW, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbA); gl.bindTexture(gl.TEXTURE_2D, texB); gl.uniform2f(P_BLUR.u.uDir, 0, (1.5+k)/BH); gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P_COMP.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texS); gl.uniform1i(P_COMP.u.uS, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texA); gl.uniform1i(P_COMP.u.uB, 1);
  gl.uniform1f(P_COMP.u.uT, time); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
