<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kneeling Colossus</title>
<!--
  The Kneeling Colossus, the first real structure (vault/04 - Design/Structures.md). Built by
  preview/structures/kneeling-colossus.js, the same builder tools/export-structure.mjs turns into the game's template
  (mod/content/data/crimson_eclipse/structure/kneeling_colossus.nbt): what is here is what generates.
  URL parameters: ?night=1  &ui=0  &spin=0
-->
</head>
<body>
<script src="vanilla/textures.js" onerror="void 0"></script>
<script src="lib/blocks.js"></script>
<script src="lib/world.js"></script>
<script src="lib/textures.js"></script>
<script src="lib/viewer.js"></script>
<script src="structures/kit.js"></script>
<script src="structures/kneeling-colossus.js"></script>
<script>
'use strict';
const K = CE.kit, build = CE.structures.kneelingColossus;
CE.viewer({ dayLabel:'Day: a ruin', variants:[{ key:'A', short:'Colossus', name:'The Kneeling Colossus', make(W) {
  const meta = build(W);
  meta.size = K.sizeOf(W);
  K.terrain(W, meta.flat);
  meta.ground(W);
  for (const [x, z, h] of meta.trees) K.spruce(W, x, z, h);
  meta.lights(W);
  return meta;
} }] });
</script>
</body>
</html>
